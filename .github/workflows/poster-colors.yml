name: Poster colours

# Analyses every poster and writes 포스터1색 / 포스터2색 / 배경색 / 포인트색 into
# data/films.xlsx, rebuilds data/films.json and saves data/poster_colors.jpg.
# Runs by hand (Actions tab -> Run workflow) or when tools/poster_colors.py is
# pushed to a branch other than main, so results can be reviewed before they go live.
on:
  workflow_dispatch:
  push:
    branches-ignore: [main]
    paths: ["tools/poster_colors.py"]

permissions:
  contents: write
  pages: write

concurrency:
  group: build-data
  cancel-in-progress: false

jobs:
  colours:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install openpyxl pillow
      - name: Analyse posters
        env:
          TMDB_KEY: ${{ secrets.TMDB_KEY }}
        run: python tools/poster_colors.py
      - name: Rebuild data/films.json
        env:
          TMDB_KEY: ${{ secrets.TMDB_KEY }}
        run: python tools/xlsx_to_json.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/films.xlsx data/films.json data/poster_colors.jpg data/tmdb_report.md 2>/dev/null || git add data
          if git diff --cached --quiet; then echo "No changes."; exit 0; fi
          git commit -m "Poster colours: background and point colour from each poster"
          git push
          echo "PUSHED=1" >> "$GITHUB_ENV"
      - name: Rebuild the site
        if: env.PUSHED == '1' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
