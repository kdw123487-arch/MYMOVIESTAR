name: Poster fetch (one-off)
on:
  push:
    branches: [poster-fetch2]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/poster_fetch.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tmp_posters && git commit -m "fetched posters" && git push
