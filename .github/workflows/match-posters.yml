name: Match posters

# Finds the TMDB poster matching each fingerprint in data/poster_refs.json and
# records it in the 포스터 column. Runs when the fingerprints are pushed to a
# branch other than main (so the result can be checked before going live).
on:
  workflow_dispatch:
  push:
    branches-ignore: [main]
    paths: ["data/poster_refs.json"]

permissions:
  contents: write

concurrency:
  group: build-data
  cancel-in-progress: false

jobs:
  match:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install openpyxl pillow
      - name: Match posters
        env:
          TMDB_KEY: ${{ secrets.TMDB_KEY }}
        run: python tools/match_posters.py
      - name: Rebuild data/films.json
        env:
          TMDB_KEY: ${{ secrets.TMDB_KEY }}
        run: python tools/xlsx_to_json.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/films.xlsx data/films.json data/poster_match.md data/tmdb_report.md
          git diff --cached --quiet && exit 0
          git commit -m "Match posters to the chosen references"
          git push
