<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Movie Star</title>
<meta name="description" content="평단과 관객이 함께 사랑한 명작 영화 50편. 보고 싶은 영화를 담고, 본 영화에 평점을 남겨 나만의 명예의 전당을 만드세요.">
<meta name="theme-color" content="#140a0d">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta property="og:type" content="website">
<meta property="og:site_name" content="My Movie Star">
<meta property="og:title" content="My Movie Star — 나만의 영화 시상식">
<meta property="og:description" content="명작 영화 50편 · 평점 · 명예의 전당">
<meta property="og:url" content="https://kdw123487-arch.github.io/MYMOVIESTAR/">
<meta property="og:image" content="https://kdw123487-arch.github.io/MYMOVIESTAR/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://image.tmdb.org">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..800;1,6..96,400..700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap">
<style>
/* Layout: a printed gala programme — quiet masthead, three-section index, nominee plates sorted on demand, a winners roll, and a full-screen film page */
:root{
  --velvet:#140a0d;--velvet-2:#1e0f16;
  --gold:#d4b06a;--gold-soft:#8f7748;--ivory:#f1e8d6;--muted:#a89a8c;--faint:#6f645b;
  --line:rgba(212,176,106,.22);--line-strong:rgba(212,176,106,.5);
  --f-display:"Bodoni Moda","Didot","Times New Roman",serif;
  --f-sans:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scrollbar-gutter:stable;scrollbar-color:rgba(212,176,106,.28) rgb(var(--bg))}
body{caret-color:transparent}
input,textarea,[contenteditable]{caret-color:auto}
body{margin:0;background:var(--velvet);color:var(--ivory);font-family:var(--f-sans);font-size:16px;line-height:1.7;
  background-image:radial-gradient(ellipse 50% 460px at 50% -60px,rgba(255,226,170,.14),transparent 70%);
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
button{font:inherit}
img{max-width:100%}
:focus-visible{outline:1px solid var(--gold);outline-offset:3px}
.wrap{max-width:1120px;margin:0 auto;padding:72px max(16px,env(safe-area-inset-right,0px)) calc(150px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}

/* masthead */
.mast{text-align:center;display:grid;justify-items:center;gap:18px;padding-bottom:56px}
.eyebrow{font-size:11px;letter-spacing:.42em;text-transform:uppercase;color:var(--gold-soft)}
.mast h1{margin:0;font-family:var(--f-display);font-weight:400;font-size:clamp(44px,8.5vw,96px);line-height:.95;letter-spacing:-.01em}
.mast h1 em,.it{font-style:italic;color:var(--gold)}
.rule{display:flex;align-items:center;gap:14px;color:var(--gold-soft);font-size:14px;letter-spacing:.3em}
.rule::before,.rule::after{content:"";width:48px;height:1px;background:var(--line-strong)}
.btn-gold{font-size:14px;font-weight:500;letter-spacing:.14em;color:var(--velvet);background:linear-gradient(180deg,#e6cb8c,var(--gold) 60%,#b08d4c);border:0;border-radius:1px;padding:14px 30px;cursor:pointer}
.btn-gold:hover{filter:brightness(1.06)}
.mast .btn-gold{margin-top:14px}
.txt{font-size:13px;letter-spacing:.04em;color:var(--muted);background:none;border:0;padding:4px 0;cursor:pointer;border-bottom:1px solid transparent;text-decoration:none}
.txt:hover{color:var(--ivory);border-bottom-color:var(--line-strong)}
.txt.gold,.txt[aria-pressed="true"]{color:var(--gold)}

/* section index */
/* bottom tab bar, fixed on every screen */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:45;display:flex;justify-content:center;gap:clamp(8px,8vw,96px);padding:6px max(12px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px));background:rgba(20,10,13,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line)}
html.film .tabs{background:rgba(var(--bg),.94)}
.tab{position:relative;flex:0 1 96px;background:none;border:0;color:var(--faint);cursor:pointer;padding:6px 4px 4px;display:grid;justify-items:center;gap:3px;border-radius:10px;transition:color .2s}
.tab svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linejoin:round}
.tab .t{font-size:11.5px;letter-spacing:.04em}
.tab:hover{color:var(--muted)}
.tab[aria-selected="true"]{color:var(--gold)}
.tab[aria-selected="true"] svg{fill:color-mix(in srgb,currentColor 18%,transparent)}
html.film .tab[aria-selected="true"]{color:var(--faint)}

/* view heads + toolbar */
.view-head{text-align:center;display:grid;gap:8px;justify-items:center;margin:64px 0 40px}
.view-head .it{font-family:var(--f-display);font-size:15px;letter-spacing:.2em}
.view-head h2{margin:0;font-size:28px;font-weight:700;letter-spacing:.02em}
.view-head .line{font-size:12.5px;color:var(--faint);letter-spacing:.04em}
.genres{display:flex;flex-wrap:wrap;gap:6px 22px;justify-content:center;margin:-12px 0 28px}
.genre{font-size:14px;color:var(--faint);background:none;border:0;border-bottom:1.5px solid transparent;border-radius:0;padding:6px 2px;cursor:pointer;white-space:nowrap;transition:color .2s,border-color .2s}
.genre:hover{color:var(--ivory)}
.genre[aria-pressed="true"]{color:var(--gold);border-bottom-color:var(--gold)}
.tools{display:flex;align-items:center;gap:22px}
.search{display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line);padding:4px 2px;transition:border-color .2s;color:var(--muted)}
.search:focus-within{border-bottom-color:var(--gold);color:var(--gold)}
.search svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;flex:none}
.search input{width:150px;background:none;border:0;outline:0;color:var(--ivory);font:13px var(--f-sans);letter-spacing:.03em;padding:2px 0;-webkit-appearance:none;appearance:none}
.search input::placeholder{color:var(--faint)}
.search input::-webkit-search-cancel-button{-webkit-appearance:none}
.dir-btn{display:grid;place-items:center;width:28px;height:28px;margin-left:-14px;background:none;border:0;border-radius:50%;color:var(--gold);cursor:pointer}
.dir-btn[hidden]{display:none}
.dir-btn svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;transition:transform .25s}
.dir-btn[data-dir="asc"] svg{transform:rotate(180deg)}
.dir-btn:hover{background:rgba(212,176,106,.1)}
.nores{text-align:center;color:var(--faint);font-size:14px;margin:60px 0}
.sortbox{position:relative}
.sort-btn{display:inline-flex;align-items:center;gap:10px;font:13px var(--f-sans);letter-spacing:.04em;color:var(--ivory);background:transparent;border:0;border-bottom:1px solid var(--line);padding:5px 2px;cursor:pointer;transition:border-color .2s}
.sort-btn:hover,.sort-btn[aria-expanded="true"]{border-bottom-color:var(--gold)}
.sort-btn svg{width:11px;height:11px;fill:none;stroke:var(--muted);stroke-width:1.4;transition:transform .2s}
.sort-btn[aria-expanded="true"] svg{transform:rotate(180deg);stroke:var(--gold)}
.sort-menu{position:absolute;right:0;top:calc(100% + 8px);z-index:30;min-width:172px;margin:0;padding:6px;list-style:none;background:rgba(30,15,22,.97);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:0;border-radius:10px;box-shadow:0 18px 40px rgba(0,0,0,.55);animation:menuIn .16s ease}
@keyframes menuIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.sort-menu li{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:9px 12px;border-radius:6px;font-size:13.5px;color:var(--muted);cursor:pointer;white-space:nowrap}
.sort-menu li:hover,.sort-menu li.active{background:rgba(212,176,106,.1);color:var(--ivory)}
.sort-menu li[aria-selected="true"]{color:var(--gold)}
.sort-menu li[aria-selected="true"]::after{content:"";width:8px;height:4px;border-left:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(-45deg) translateY(-2px)}
@media (max-width:640px){.sort-menu{max-width:calc(100vw - 24px)}}
.heart{display:inline-grid;place-items:center;width:34px;height:34px;margin:-8px -6px;border:0;background:none;color:var(--muted);cursor:pointer;border-radius:50%}
.heart svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;transition:transform .2s ease,fill .2s ease}
.heart:hover{color:var(--ivory)}.heart:hover svg{transform:scale(1.12)}
.heart[aria-pressed="true"]{color:#d9707f}.heart[aria-pressed="true"] svg{fill:currentColor}
.heart.pop svg{animation:pop .35s ease}
@keyframes pop{50%{transform:scale(1.3)}}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:-8px 0 32px;padding-bottom:12px;border-bottom:1px solid var(--line);font-size:13px;color:var(--faint)}
.sort{display:flex;gap:4px 18px;flex-wrap:wrap;justify-content:flex-end}
.sort button{background:none;border:0;border-bottom:1px solid transparent;color:var(--faint);font-size:13px;padding:3px 0;cursor:pointer}
.sort button:hover{color:var(--muted)}
.sort button[aria-pressed="true"]{color:var(--ivory);border-bottom-color:var(--gold)}

/* plates */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:44px 28px}
.card{display:flex;flex-direction:column;min-width:0}
.poster{position:relative;display:block;aspect-ratio:2/3;overflow:hidden;border-radius:6px;background:#000;outline:1px solid var(--line);outline-offset:-1px;color:inherit;text-decoration:none}
.poster canvas{display:block;width:100%;height:100%}
.poster .state{position:absolute;top:12px;left:14px;z-index:3;font-size:10px;letter-spacing:.3em;color:var(--gold);text-shadow:0 1px 6px rgba(0,0,0,.8)}
.poster .ptitle{position:absolute;left:14px;right:14px;bottom:14px;font-family:var(--f-display);font-style:italic;font-size:21px;line-height:1.15;color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.7);text-wrap:balance}
.card:hover .poster canvas,.card:hover img.pimg{filter:brightness(1.08)}
.card.is-seen .poster{outline-color:var(--line-strong)}
img.pimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .6s ease;z-index:1}
.has-img img.pimg{opacity:1}
.has-img .ptitle{display:none}
.poster.has-img::before{content:"";position:absolute;inset:0 0 auto;height:22%;background:linear-gradient(rgba(10,4,6,.45),transparent);z-index:2;pointer-events:none}

.body{padding:18px 0 0;display:flex;flex-direction:column;gap:8px;min-width:0;flex:1}
.body h3{margin:0;font-size:18px;line-height:1.4;font-weight:700}
.sub{font-size:12px;color:var(--faint);letter-spacing:.04em}
.award{font-size:12px;color:var(--gold-soft);line-height:1.5;overflow-wrap:anywhere}
.plot{margin:2px 0 0;font-size:14px;color:var(--muted);line-height:1.65;font-weight:300}
.plot{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;line-clamp:2;overflow:hidden;min-height:calc(2em*1.65)}
.verdict{display:grid;gap:4px;margin-top:4px}
.aw{font-size:11px;letter-spacing:.24em;color:var(--gold)}
.verdict q{font-size:14px;line-height:1.65;quotes:"“" "”";font-weight:300;white-space:pre-wrap;overflow-wrap:anywhere}
.acts{margin-top:auto;padding-top:14px;border-top:1px solid var(--line);display:flex;gap:18px;flex-wrap:nowrap;align-items:center}
.spacer{flex:1}
/* card action bar: two equal halves, icon + label */
.card .acts{display:flex;justify-content:flex-start;gap:20px;padding-top:12px;border-top:0;align-items:center}

.act-btn{display:inline-flex;align-items:center;justify-content:flex-start;gap:6px;padding:4px 0;background:none;border:0;font:13px var(--f-sans);letter-spacing:.04em;color:var(--muted);cursor:pointer;transition:color .2s,background-color .2s;border-radius:0 0 6px 6px}
.act-btn svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linejoin:round;transition:transform .2s ease,fill .2s ease}
.act-btn:hover{color:var(--ivory)}
.act-btn:hover svg{transform:scale(1.1)}
.act-btn.heart-act[aria-pressed="true"]{color:#d9707f}.act-btn.heart-act[aria-pressed="true"] svg{fill:currentColor}
.act-btn.star-act{color:var(--gold-soft)}.act-btn.star-act:hover{color:var(--gold)}
.act-btn.star-act.done{color:var(--gold)}.act-btn.star-act.done svg{fill:currentColor}
.act-btn.pop svg{animation:pop .35s ease}
.stars{display:inline-flex;gap:3px;color:var(--gold);white-space:nowrap;vertical-align:middle}
.stars svg{width:14px;height:14px;fill:currentColor;stroke:currentColor;stroke-width:1.7;stroke-linejoin:round}
.stars .off{color:rgba(212,176,106,.22)}
a.open{color:inherit;text-decoration:none;background-image:linear-gradient(var(--gold),var(--gold));background-size:0 1px;background-repeat:no-repeat;background-position:0 100%;transition:background-size .3s ease}
a.open:hover{background-size:100% 1px}

/* age rating mark: soft rounded square, KMRB hues muted */
.age{display:inline-grid;place-items:center;min-width:17px;height:15px;padding:0 3px;border-radius:4px;font:600 9px/1 var(--f-sans);letter-spacing:-.02em;color:#f6efe3}
.age.ALL{background:#5d8f6c;font-size:7.5px}
.age.a12{background:#b39a52;color:#231c08}
.age.a15{background:#b8794a}
.age.a18{background:#a65556}
.age.lg{min-width:24px;height:21px;border-radius:5px;font-size:11px}.age.lg.ALL{font-size:9px}
.sub{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.empty{margin:72px auto;max-width:420px;text-align:center;display:grid;gap:14px;justify-items:center;color:var(--muted)}
.empty .big{font-family:var(--f-display);font-style:italic;font-size:30px;color:var(--gold)}
.empty p{margin:0}

/* hall of fame */
.headline{display:grid;grid-template-columns:minmax(180px,250px) 1fr;gap:44px;align-items:center;padding:44px 0;border-block:1px solid var(--line-strong);margin-bottom:64px;background:radial-gradient(ellipse 40% 80% at 18% 50%,rgba(212,176,106,.10),transparent 70%)}
.headline .hl{display:grid;gap:12px;min-width:0}
.headline .eyebrow{color:var(--gold)}
.headline h3{margin:0;font-size:clamp(30px,4.4vw,44px);line-height:1.15}
.en{font-family:var(--f-display);font-style:italic;color:var(--gold-soft);font-size:18px}
.headline blockquote{margin:8px 0 0;font-size:17px;line-height:1.8;white-space:pre-wrap;max-width:52ch;font-weight:300}
.headline blockquote::before{content:"“";font-family:var(--f-display);color:var(--gold);font-size:40px;line-height:0;vertical-align:-.35em;margin-right:4px}
.roll-title{text-align:center;font-size:11px;letter-spacing:.42em;color:var(--gold-soft);margin-bottom:12px}
.roll{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.roll li{display:grid;grid-template-columns:56px 64px 1fr auto;gap:22px;align-items:center;padding:20px 0;border-bottom:1px solid var(--line)}
.roll .rk{font-family:var(--f-display);font-style:italic;font-size:30px;color:var(--gold);text-align:center}
.roll .th{position:relative;border-radius:4px;width:64px;aspect-ratio:2/3;overflow:hidden;outline:1px solid var(--line);outline-offset:-1px}
.roll .th canvas{width:100%;height:100%;display:block}
.roll .info{display:grid;gap:3px;min-width:0}
.roll h4{margin:0;font-size:17px;line-height:1.4}
.roll h4 span{font-family:var(--f-display);font-style:italic;font-weight:400;font-size:14px;color:var(--faint);margin-left:8px}
.roll .ml{display:flex;gap:12px;align-items:baseline}
.roll q{font-size:14px;color:var(--muted);quotes:"“" "”";overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:300}
.roll .ra{display:flex;gap:16px}
.data-tools{margin-top:72px;display:flex;gap:6px 22px;flex-wrap:wrap;justify-content:center;font-size:12px;color:var(--faint)}
.data-tools span{flex-basis:100%;text-align:center}

.foot{margin-top:96px;padding-top:28px;border-top:1px solid var(--line);font-size:12px;color:var(--faint);text-align:center;display:grid;gap:6px;justify-items:center}
.foot a{color:var(--muted)}
.foot img{display:block;opacity:.75;margin:6px 0}

/* modal stage (rating, transfer) */
.stage{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:rgba(8,3,5,.9);padding:16px;overflow-y:auto}
.panel{width:min(520px,100%);border-radius:12px;background:var(--velvet-2);border:0;box-shadow:0 24px 60px rgba(0,0,0,.55);padding:36px 32px 30px;display:grid;gap:14px;animation:rise .7s cubic-bezier(.2,.8,.2,1)}
.panel.center{text-align:center}
.panel h3{margin:0;font-size:26px;line-height:1.25}
.panel p{margin:0;font-size:14.5px;color:var(--muted);text-align:left;line-height:1.75;font-weight:300}
.pactions{display:flex;gap:22px;justify-content:center;align-items:center;flex-wrap:wrap;margin-top:8px}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.form{display:grid;gap:20px;text-align:left}
.fld{display:grid;gap:6px;min-width:0;border:0;margin:0;padding:0}
.fld legend,.fld>span{font-size:11px;letter-spacing:.24em;color:var(--gold-soft);padding:0}
.fld textarea{width:100%;font:300 16px/1.7 var(--f-sans);color:var(--ivory);background:transparent;border:1px solid var(--line);padding:10px 12px;min-height:120px;resize:none}
.fld textarea:focus{outline:none;border-color:var(--gold)}
.seg{display:flex;gap:22px}
.seg label{font-size:14px;padding:4px 0;cursor:pointer;color:var(--faint);border-bottom:1px solid transparent}
.seg input,.rate input{position:absolute;opacity:0;pointer-events:none}
.seg label:has(input:checked){color:var(--ivory);border-bottom-color:var(--gold)}
.seg label:has(input:focus-visible){outline:1px solid var(--gold);outline-offset:3px}
.rate{display:flex;flex-direction:row-reverse;justify-content:flex-end;gap:4px}
.rate label{display:grid;line-height:1;cursor:pointer;color:rgba(212,176,106,.2);padding:2px}
.rate label svg{width:26px;height:26px;fill:currentColor;stroke:currentColor;stroke-width:1.7;stroke-linejoin:round}
.rate label:hover,.rate label:hover~label,.rate input:checked~label{color:var(--gold)}
.rate input:focus-visible+label{outline:1px solid var(--gold)}
.rate-note{font-size:12.5px;color:var(--muted)}
.err{font-size:13px;color:#e8a59b}.err:empty{display:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.panel:has(.rf){padding:28px 28px 22px;gap:0;width:min(480px,100%)}
.rf{gap:22px}
.rf-head{display:grid;grid-template-columns:140px 1fr;gap:20px;align-items:center}
.rf-head h3{margin:0;font-size:22px;line-height:1.3}.rf-head .en{font-size:15px}
.rf-poster{position:relative;aspect-ratio:2/3;border-radius:8px;box-shadow:0 14px 34px rgba(0,0,0,.5);overflow:hidden;outline:1px solid var(--line);outline-offset:-1px}
.rf-poster canvas{display:block;width:100%;height:100%}
.seg.pill{gap:0;padding:3px;border-radius:999px;background:rgba(255,255,255,.04);border:1px solid var(--line);width:max-content}
.seg.pill label{padding:7px 18px;border-radius:999px;border:0;font-size:13.5px;color:var(--muted)}
.seg.pill label:has(input:checked){background:var(--gold);color:var(--velvet)}
.rf-rate{justify-items:center;gap:6px;padding:6px 0}
.rf-rate .rate{justify-content:center;gap:6px}
.rf-rate .rate label svg{width:38px;height:38px}
.rf-rate .rate label{transition:transform .15s,color .15s}
.rf-rate .rate label:hover{transform:scale(1.12)}
.rf-rate .rate-note{font-size:14px;color:var(--ivory);min-height:1.5em}
.rf textarea{border-radius:8px;background:rgba(255,255,255,.03);height:96px;min-height:0;resize:none}
.rf .count{justify-self:end;font-size:11.5px;color:var(--faint)}
.rf-actions{display:flex;align-items:center;gap:18px;padding-top:4px}
.rf-actions .btn-gold{padding:11px 26px;border-radius:999px;letter-spacing:.08em}
.linkbox{width:100%;font:13px/1.4 var(--f-sans);color:var(--muted);background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-top:6px}

<script>
"use strict";
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const clip=(s,n)=>(s=String(s)).length>n?s.slice(0,n).trimEnd()+"…":s;
const AWARDS={5:"대상",4:"최우수작품상",3:"우수작품상",2:"특별언급",1:"황금 라즈베리"};
const STARP="M12 3.5l2.6 5.4 5.9.8-4.3 4.1 1 5.8L12 16.8l-5.2 2.8 1-5.8-4.3-4.1 5.9-.8z";
const stars=n=>`<span class="stars" role="img" aria-label="별점 ${n}점">${[1,2,3,4,5].map(i=>`<svg viewBox="0 0 24 24" class="${i<=n?"":"off"}" aria-hidden="true"><path d="${STARP}"/></svg>`).join("")}</span>`;
let toastT;function toast(m){const t=$("toast");t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2400)}
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}}};

/* ---------- data ---------- */
let FILMS=[],BY_KEY={},RETIRED={};
const DB=store.get("mymoviestar.v1",{items:{}});if(!DB.items)DB.items={};
const entry=k=>DB.items[k];
const entries=()=>Object.values(DB.items);
const save=()=>store.set("mymoviestar.v1",DB)||toast("이 브라우저에서는 저장할 수 없어요. 백업을 내보내 두세요.");
/* a film for any key: listed nominee, retired nominee, or an old custom record */
function info(k){const e=entry(k)||{};return BY_KEY[k]||{key:k,...RETIRED[k],...(e.ko?{ko:e.ko,en:e.en,y:e.y,n:e.n}:{})}}

/* ---------- painted fallback art ---------- */
const MOTIFS=["sun","waves","bands","rings","split","peaks","arch","rays","grid","dots","trees"];
const PALS=[["#e9e6df","#8d8a84","#1b1b1b"],["#c9a46a","#2a1a12","#050302"],["#9fb7cc","#2e4257","#0b1118"],["#e7c9a9","#c0583c","#24324a"],["#cfe2a8","#3e6a4a","#0f1c14"],["#f2c14e","#3b3f8f","#14112b"]];
function hash(s){let h=7;for(const ch of String(s))h=(h*31+ch.codePointAt(0))%100003;return h}
function look(f){const h=hash(f.key||f.ko);return{seed:h,pal:f.pal||PALS[h%PALS.length],m:f.m||MOTIFS[(h>>3)%MOTIFS.length]}}
/* ---------- per-film banner scenes: one simple emblem drawn from each film's own imagery, in the film's colours ---------- */
function sceneKit(x,W,H,cx,cy,r,[a,b,c],pal){
  const u=Math.min(W,H)*.5,ice=pal?.ice?.[3]||b;
  const D={x,W,H,cx,cy,u,r,a,b,c,ice,w:pal?.wall||b,h:pal?.hole||c,l:pal?.line||a};
  D.cir=(px,py,rr,col,al=1)=>{x.globalAlpha=al;x.fillStyle=col;x.beginPath();x.arc(px,py,rr,0,7);x.fill()};
  D.ring=(px,py,rr,col,lw=2,al=1)=>{x.globalAlpha=al;x.strokeStyle=col;x.lineWidth=lw;x.beginPath();x.arc(px,py,rr,0,7);x.stroke()};
  D.rect=(px,py,w,h,col,al=1)=>{x.globalAlpha=al;x.fillStyle=col;x.fillRect(px,py,w,h)};
  D.poly=(p,col,al=1)=>{x.globalAlpha=al;x.fillStyle=col;x.beginPath();p.forEach(([px,py],i)=>i?x.lineTo(px,py):x.moveTo(px,py));x.closePath();x.fill()};

/* ---------- TMDB data (poster, Korean age rating, streaming) is baked into films.json at build time ---------- */

const tmOf=k=>info(k).tm||{};
const AGE={ALL:["ALL","전체 관람가"],12:["12","12세 이상 관람가"],15:["15","15세 이상 관람가"],18:["18","청소년 관람불가"]};
const ageMark=(a,lg)=>AGE[a]?`<span class="age ${a==="ALL"?"ALL":"a"+a}${lg?" lg":""}" role="img" aria-label="${AGE[a][1]}" title="${AGE[a][1]}">${AGE[a][0]}</span>`:"";
/* fill a poster box: real poster + age mark */
function decorate(box,key,size="w342",slot){
  if(!box)return;const f=info(key),d=tmOf(key);
  if(slot)slot.innerHTML=ageMark(f.age||d.age);
  if(!d.p)return;const img=document.createElement("img");img.className="pimg";img.alt="";img.decoding="async";img.loading="lazy";
  img.onload=()=>box.classList.add("has-img");img.onerror=()=>img.remove();img.src=IMG+size+d.p;box.appendChild(img);

/* streaming services: search links for the services we know, otherwise the TMDB/JustWatch page */
const PLAT=[[/netflix/i,q=>"https://www.netflix.com/search?q="+q],[/watcha/i,q=>"https://watcha.com/search?query="+q],
  [/apple tv/i,q=>"https://tv.apple.com/kr/search?term="+q],[/google play/i,q=>"https://play.google.com/store/search?c=movies&q="+q]];
function platLink(p,f,w){const m=PLAT.find(([re])=>re.test(p.n));return m?m[1](encodeURIComponent(f.ko)):(w.link||"https://www.justwatch.com/kr")}

/* ---------- cards (same plate in 전체, 찜 목록 and 명예의 전당) ---------- */
const STAR='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5l2.6 5.4 5.9.8-4.3 4.1 1 5.8L12 16.8l-5.2 2.8 1-5.8-4.3-4.1 5.9-.8z"/></svg>';
const HEART='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20.5s-7.5-4.6-9.3-9.2C1.4 7.9 3.6 4.5 7 4.5c2 0 3.6 1.1 5 3 1.4-1.9 3-3 5-3 3.4 0 5.6 3.4 4.3 6.8-1.8 4.6-9.3 9.2-9.3 9.2z"/></svg>';
const heartBtn=(k,on)=>`<button class="heart" type="button" data-toggle-want="${k}" aria-pressed="${!!on}" aria-label="${on?"찜 해제":"찜하기"}" title="${on?"찜 해제":"찜하기"}">${HEART}</button>`;
const cards={};
function card(key,keep){
  const f=info(key),el=document.createElement("article");el.className="card";el.dataset.key=key;
  el.innerHTML=`<a class="poster" href="#film/${encodeURIComponent(key)}" tabindex="-1" aria-hidden="true"><canvas></canvas><span class="state"></span><span class="ptitle">${esc(f.en||f.ko)}</span></a>
    <div class="body"><h3><a class="open" href="#film/${encodeURIComponent(key)}">${esc(f.ko)}</a></h3><div class="sub"><span>${[f.y,f.n].filter(Boolean).map(esc).join(" · ")}</span><span class="age-slot"></span></div>
    ${f.aw?`<div class="award" data-aw="${esc(f.aw)}" title="${esc(f.aw)}">${esc(f.aw)}</div>`:""}<div class="slot"></div><div class="acts"></div></div>`;
  paint(el.querySelector("canvas"),f,480,720,bannerPal(f));decorate(el.querySelector(".poster"),key,"w342",el.querySelector(".age-slot"));
  if(keep)cards[key]=el;sync(el,key);return el;
}
function sync(el,key){
  const f=info(key),e=entry(key),seen=e?.status==="seen",want=e?.status==="want";
  el.querySelector(".state").textContent=seen?AWARDS[e.rating]:"";
  el.classList.toggle("is-seen",seen);
  el.querySelector(".slot").innerHTML=seen?`<div class="verdict">${stars(e.rating)}${e.review?`<q>${esc(e.review)}</q>`:""}</div>`
    :f.p?`<p class="plot" title="${esc(f.p)}">${esc(f.p)}</p>`:"";
  const acts=el.querySelector(".acts");acts.classList.toggle("one",seen);
  acts.innerHTML=seen?`<button class="act-btn star-act done" type="button" data-edit="${key}">${STAR}<span>평점 수정</span></button>`
    :`<button class="act-btn heart-act" type="button" data-toggle-want="${key}" aria-pressed="${!!want}" aria-label="${want?"찜 해제":"찜하기"}">${HEART}<span>찜</span></button><button class="act-btn star-act" type="button" data-review="${key}">${STAR}<span>평점</span></button>`;
}
/* award line: at most two lines — drop the less important honours (listed last) instead of cutting text */
function fitAwards(root=document){
  root.querySelectorAll(".award[data-aw]").forEach(el=>{
    if(!el.offsetParent)return;
    const full=el.dataset.aw,max=parseFloat(getComputedStyle(el).lineHeight)*2+1;
    let parts=full.split(" · ");el.textContent=full;
    while(el.scrollHeight>max&&parts.length>1){parts.pop();el.textContent=parts.join(" · ")}
    if(el.scrollHeight>max)el.textContent=parts.join(" · ").replace(/\s*\([^)]*\)/g,"");
  });
}
let fitT;addEventListener("resize",()=>{clearTimeout(fitT);fitT=setTimeout(fitAwards,150)});
/* genres: tags from the 장르 column; rare ones fold into a close, common one */
const GENRE_ALIAS={"미스터리":"스릴러","공포":"스릴러","호러":"스릴러","모험":"액션","뮤지컬":"로맨스","법정":"드라마","실화":"드라마","전기":"드라마","전쟁":"드라마","음악":"드라마","고딕":"판타지","웨스턴":"드라마"};

let curGenre="전체",curSort="pick",curDir="desc",curQ="";
function buildGenres(){
  const count={};FILMS.forEach(f=>tagsOf(f).forEach(t=>count[t]=(count[t]||0)+1));
  const list=["전체",...Object.keys(count).filter(t=>count[t]>=3).sort((a,b)=>count[b]-count[a])];
  $("genres").innerHTML=list.map(t=>`<button class="genre" type="button" data-genre="${esc(t)}" aria-pressed="${t===curGenre}">${esc(t)}</button>`).join("");
}
function applyList(){
  const g=$("nomGrid"),sg=curDir==="desc"?-1:1,sorted=[...FILMS].sort((a,b)=>SORTS[curSort](a,b)*sg||a.i-b.i);let n=0;
  const q=curQ.trim().toLowerCase();
  sorted.forEach(f=>{const el=cards[f.key],on=(curGenre==="전체"||tagsOf(f).has(curGenre))&&(!q||[f.ko,f.en,f.dir,f.cast,f.g,f.y].join(" ").toLowerCase().includes(q));el.hidden=!on;if(on)n++;g.appendChild(el)});
  $("nomCount").textContent=`${n}편`;$("nomNone").hidden=n>0;
  $("genres").querySelectorAll(".genre").forEach(b=>b.setAttribute("aria-pressed",b.dataset.genre===curGenre));

const SORTS={pick:()=>0,year:(a,b)=>yr(a.y)-yr(b.y),title:(a,b)=>a.ko.localeCompare(b.ko,"ko"),rt:(a,b)=>(a.rt||999)-(b.rt||999)};
const DEFDIR={year:"desc",title:"asc",rt:"asc"};
/* sort menu: a small listbox styled like the rest of the site (keyboard: ↑↓ Enter Esc) */
const sortBtn=$("sortBtn"),sortMenu=$("sortMenu"),sortItems=[...sortMenu.querySelectorAll("li")];let sortActive=0;
function syncSort(){const db=$("dirBtn");db.hidden=curSort==="pick";db.dataset.dir=curDir;const lb=curSort==="year"?(curDir==="desc"?"최신순":"오래된 순"):curSort==="title"?(curDir==="asc"?"가나다 순":"가나다 역순"):curSort==="rt"?(curDir==="asc"?"짧은 순":"긴 순"):"";db.setAttribute("aria-label",lb?`${lb} (눌러서 순서 바꾸기)`:"");db.title=lb;sortItems.forEach(li=>li.setAttribute("aria-selected",li.dataset.v===curSort));$("sortLabel").textContent=sortItems.find(li=>li.dataset.v===curSort).textContent}

function fitSort(){sortMenu.style.left="";sortMenu.style.right="0";const r=sortMenu.getBoundingClientRect(),vw=document.documentElement.clientWidth,m=12;let dx=0;if(r.right>vw-m)dx=vw-m-r.right;if(r.left+dx<m)dx=m-r.left;if(dx){sortMenu.style.right="auto";sortMenu.style.left=(sortMenu.offsetLeft+dx)+"px"}}

function closeSort(focus){sortMenu.hidden=true;sortBtn.setAttribute("aria-expanded","false");if(focus)sortBtn.focus()}
function saveSort(){store.set("mymoviestar.sort",curSort);store.set("mymoviestar.dir",curDir)}
function pickSort(v){v=SORTS[v]?v:"pick";if(v!==curSort)curDir=DEFDIR[v]||curDir;curSort=v;saveSort();closeSort(true);applyList()}
$("dirBtn").onclick=()=>{curDir=curDir==="desc"?"asc":"desc";saveSort();applyList()};
$("q").oninput=e=>{curQ=e.target.value;applyList()};
sortBtn.onclick=()=>sortMenu.hidden?openSort():closeSort();

const sheet=$("sheet");let sheetKey=null,sheetT=null,curView="nominees";

  sheet.className="sheet fx-"+(info(k).ef||"classic")+(sheet.classList.contains("scrolled")?" scrolled":"");

  const fx=(t,v,full)=>v?`<div${full?' class="full"':""}><dt>${t}</dt><dd>${v}</dd></div>`:"";
  sheet.innerHTML=`<div class="sheet-bar"><button class="home-btn" type="button" data-leave aria-label="홈으로" title="홈으로"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 11 12 4l8.5 7"/><path d="M5.5 9.5V20h4.5v-5.5h4V20h4.5V9.5"/></svg></button></div>
    <header class="banner"><canvas aria-hidden="true"></canvas><div class="cap"><h2 id="sTitle" tabindex="-1">${esc(f.ko)}</h2>${f.en&&f.en!==f.ko?`<div class="en${f.ef&&f.ef!=="classic"?" ef-"+f.ef:""}" lang="en">${esc(f.en)}</div>`:""}</div></header>
    <div class="sbody">
      <aside class="side"><div class="sposter" aria-hidden="true"><canvas></canvas></div>
        ${f.aw?`<div class="honor"><h4>수상</h4>${esc(f.aw)}</div>`:""}
        <div class="where" id="where"></div></aside>
      <main><dl class="factsheet">${fx("감독",esc(f.dir))+fx("개봉",esc(f.y))+fx("러닝타임",f.rt?f.rt+"분":"")+fx("장르",esc(f.g))+fx("제작 국가",esc(f.n))+`<div id="ageCell" hidden><dt>관람등급</dt><dd></dd></div>`+fx("출연",esc(f.cast),1)}</dl>
        ${f.s?`<section class="sec"><h3>Synopsis</h3><p>${esc(f.s)}</p></section>`:""}
        ${f.w?`<section class="sec"><h3>Why it's nominated</h3><p>${esc(f.w)}</p></section>`:""}
        ${f.pt?`<section class="sec"><h3>What to watch for</h3><ol class="points">${f.pt.map(x=>`<li>${esc(x)}</li>`).join("")}</ol></section>`:""}
        <section class="sec"><h3>My rating</h3><div class="mybox">${seen
          ?`<div><span class="aw">${AWARDS[e.rating]}</span> ${stars(e.rating)}</div>${e.review?`<blockquote>${esc(e.review)}</blockquote>`:""}<div class="acts"><button class="txt gold" type="button" data-edit="${k}">평점 수정</button></div>`
          :`<p style="color:var(--faint)">아직 평점을 남기지 않았어요.</p><div class="acts">${listed?heartBtn(k,want):""}<button class="txt gold" type="button" data-review="${k}">평점 남기기</button></div>`}</div></section>
      </main></div>`;
  paint(sheet.querySelector(".banner canvas"),f,1600,640,bannerPal(f));paint(sheet.querySelector(".sposter canvas"),f,480,720,bannerPal(f));decorate(sheet.querySelector(".sposter"),k,"w500");
  {const d=tmOf(k);
    const a=f.age||d.age,cell=$("ageCell");if(a&&cell){cell.hidden=false;cell.querySelector("dd").innerHTML=ageMark(a,1)+AGE[a][1]}
    const w=d.w,box=$("where");
    const noAds=a=>(a||[]).filter(p=>!/with ads|ads|광고/i.test(p.n));
    const row=(t,list)=>(list=noAds(list)).length?`<div><div class="kind">${t}</div><div class="plats">${list.map(p=>`<a class="plat" href="${esc(platLink(p,f,w))}" target="_blank" rel="noopener">${p.l?`<img src="${IMG}w92${p.l}" alt="" width="24" height="24" loading="lazy">`:""}${esc(p.n)}</a>`).join("")}</div></div>`:"";
    box.innerHTML=`<h4>볼 수 있는 곳</h4>`+(w&&(noAds(w.sub).length||noAds(w.rent).length)?row("구독",w.sub)+row("대여 · 구매",w.rent.slice(0,6))+`<div class="note">국내 기준 · 정보 제공 JustWatch${w.link?` · <a href="${esc(w.link)}" target="_blank" rel="noopener">전체 보기</a>`:""}</div>`
      :`<div class="note">${d.id?"국내 스트리밍 정보가 없습니다.":"스트리밍 정보가 아직 없습니다."}</div>`);

/* per-film English title fonts, loaded only when a film page needs one */
const EF={elegant:"Cormorant+Garamond:ital,wght@1,500;1,600",noir:"Playfair+Display:ital,wght@1,700",epic:"Cinzel:wght@600",typewriter:"Special+Elite",mono:"Courier+Prime:wght@400;700",
  bold:"Bebas+Neue",scifi:"Orbitron:wght@500",gothic:"UnifrakturMaguntia",western:"Rye",retro:"Abril+Fatface",script:"Great+Vibes",hand:"Caveat:wght@600;700",comic:"Bangers",light:"Josefin+Sans:wght@300;400",neon:"Monoton"};
const ACC={...EF,classic:"",gothic:"IM+Fell+English+SC",script:EF.elegant,neon:EF.bold};
const efLoaded=new Set();
function loadFont(spec){if(!spec||efLoaded.has(spec))return;efLoaded.add(spec);const l=document.createElement("link");l.rel="stylesheet";l.href=`https://fonts.googleapis.com/css2?family=${spec}&display=swap`;document.head.appendChild(l)}
/* banner in the film's own colours: pattern in the point colour, light rising from the background colour */
function bannerPal(f){
  if(!f.bg||!f.ac)return;
  /* each colour stays in its own hue: blending two far-apart hues (navy + mustard) turns to mud */
  const toHsl=([r,g,b])=>{r/=255;g/=255;b/=255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2,d=mx-mn;let h=0;
      if(d)h=(mx===r?((g-b)/d+6)%6:mx===g?(b-r)/d+2:(r-g)/d+4)*60;return[h,d?d/(1-Math.abs(2*l-1)):0,l]},
    hsl=(h,s,l)=>`hsl(${h.toFixed(1)} ${(Math.min(1,s)*100).toFixed(1)}% ${(Math.min(1,l)*100).toFixed(1)}%)`,
    [bh,bs,bl]=toHsl(hex(f.bg)),[ah,as,al]=toHsl(hex(f.ac));
  /* 배너색 column: a banner pattern colour of its own, separate from the point colour */
  const [ph,ps,pl]=f.bc?toHsl(hex(f.bc)):[ah,as*.8,al*.88];
  const p=[hsl(ph,ps,pl),hsl(bh,Math.min(.6,bs*1.25+.04),bl+.11),hsl(bh,bs,bl*.7)];
  p.wall=hsl(bh,bs*.8,bl+.07);p.hole=hsl(bh,bs,bl*.6);p.line=hsl(ah,as,al);
  p.sky=hsl(bh,bs*.75,bl+.2);p.ice=[hsl(bh,bs*.55,.34),hsl(bh,bs*.4,.5),hsl(bh,bs*.3,.68),hsl(bh,bs*.2,.86)];
  return p;
}
/* page colour: the 배경색 column of the spreadsheet, used as is */
function tone([r,g,b]){r/=255;g/=255;b/=255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2,d=mx-mn,L=.115;
  let h=0,s=d?d/(1-Math.abs(2*l-1)):0;if(d)h=mx===r?((g-b)/d+6)%6:mx===g?(b-r)/d+2:(r-g)/d+4;h*=60;
  s=Math.min(s,.42)*.75;const C=(1-Math.abs(2*L-1))*s,X=C*(1-Math.abs(h/60%2-1)),m=L-C/2;
  const [R,G,B]=h<60?[C,X,0]:h<120?[X,C,0]:h<180?[0,C,X]:h<240?[0,X,C]:h<300?[X,0,C]:[C,0,X];
  return [R,G,B].map(v=>Math.round((v+m)*255))}
const hex=h=>{const n=parseInt(h.slice(1),16);return[n>>16,n>>8&255,n&255]};
function tint(k){const f=info(k),st=document.documentElement.style;st.setProperty("--bg",(f.bg?hex(f.bg):tone(hex(look(f).pal[1]))).join(","));
  if(f.ac)st.setProperty("--ac",hex(f.ac).join(","));else st.removeProperty("--ac")}
let homeY=0;
function openSheet(k){
  const f=info(k),was=sheetKey;sheetKey=k;clearTimeout(sheetT);sheet.classList.remove("leaving");
  loadFont(EF[f.ef]);loadFont(ACC[f.ef||"classic"]);renderSheet(k);if(was!==k)tint(k);
  if(sheet.hidden){homeY=scrollY;$("home").hidden=true;sheet.hidden=false;document.documentElement.classList.add("film")}
  if(was!==k){scrollTo(0,0);sheet.classList.remove("scrolled");$("sTitle").focus({preventScroll:true})}
}
function closeSheet(){
  if(sheet.hidden||!sheetKey)return;const k=sheetKey;sheetKey=null;
  const done=()=>{if(sheetKey)return;sheet.hidden=true;sheet.classList.remove("leaving");sheet.replaceChildren();
    const root=document.documentElement;root.classList.remove("film");root.style.removeProperty("--bg");root.style.removeProperty("--ac");$("home").hidden=false;scrollTo(0,homeY);
    const back=document.querySelector(`a.open[href="#film/${CSS.escape(encodeURIComponent(k))}"]`);if(back?.offsetParent)back.focus({preventScroll:true})};
  if(matchMedia("(prefers-reduced-motion: reduce)").matches)done();else{sheet.classList.add("leaving");sheetT=setTimeout(done,380)}
}
/* "back to the ceremony" always lands on the home view, however many films were opened in between */
const leaveSheet=()=>{history.replaceState(null,"","#"+curView);route()};

/* ---------- tabs & routing ---------- */
const VIEWS=["nominees","watch","hall"];
function show(v,push){
  if(!VIEWS.includes(v))v="nominees";curView=v;
  VIEWS.forEach(k=>{$("view-"+k).hidden=k!==v;const t=$("tab-"+k);t.setAttribute("aria-selected",k===v);t.tabIndex=k===v?0:-1});
  if(push)history.replaceState(null,"","#"+v);
  fitAwards($("view-"+v));
}
function route(){
  const h=decodeURIComponent(location.hash.slice(1));
  if(h.startsWith("sync=")){history.replaceState(null,"","#hall");show("hall");receiveSync(h.slice(5));return}
  if(h.startsWith("film/")){const k=h.slice(5);if(BY_KEY[k]||entry(k)){openSheet(k);return}}
  closeSheet();show(h);
}
document.querySelector(".tabs").addEventListener("click",e=>{const t=e.target.closest(".tab");if(!t)return;
  if(sheetKey){history.replaceState(null,"","#"+t.dataset.view);route();scrollTo(0,0)}else{show(t.dataset.view,true);scrollTo({top:0,behavior:"smooth"})}});
document.querySelector(".tabs").addEventListener("keydown",e=>{if(!/Arrow(Left|Right)/.test(e.key))return;
  const nx=VIEWS[(VIEWS.indexOf(curView)+(e.key==="ArrowRight"?1:2))%3];show(nx,true);$("tab-"+nx).focus()});
addEventListener("hashchange",route);

/* ---------- modal stage ---------- */
const stage=$("stage"),panel=$("panel");let lastFocus=null;
function openPanel(html,center){lastFocus=document.activeElement;panel.className="panel"+(center?" center":"");void panel.offsetWidth;panel.innerHTML=html;stage.hidden=false;document.documentElement.style.overflow="hidden"}
function closePanel(){stage.hidden=true;document.documentElement.style.overflow="";lastFocus?.isConnected&&lastFocus.focus()}
stage.addEventListener("click",e=>{if(e.target===stage)closePanel()});
document.addEventListener("keydown",e=>{
  if(stage.hidden){if(e.key==="Escape"&&sheetKey)leaveSheet();return}
  if(e.key==="Escape")closePanel();
  if(e.key==="Tab"){const f=[...panel.querySelectorAll("button,input,textarea,a[href]")].filter(n=>n.offsetParent);if(!f.length)return;
    const a=f[0],z=f.at(-1);if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus()}else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus()}}
});
const NOTE={1:"별로였어요",2:"아쉬웠어요",3:"괜찮았어요",4:"좋았어요",5:"최고예요"};
function ballot(k,status){
  const f=info(k),e=entry(k),st="seen",rating=e?.rating||0;
  openPanel(`<form class="form rf" id="bf" novalidate>
      <div class="rf-head"><div class="rf-poster"><canvas></canvas></div><div><h3 id="dlgTitle">${esc(f.ko)}</h3>${f.en?`<div class="en">${esc(f.en)}${f.y?`, ${esc(f.y)}`:""}</div>`:""}</div></div>
      <fieldset class="fld rf-rate" id="rateBox"><legend class="sr">별점</legend>
        <div class="rate">${[5,4,3,2,1].map(n=>`<input type="radio" name="rating" id="r${n}" value="${n}" ${rating===n?"checked":""}><label for="r${n}" aria-label="${n}점 ${NOTE[n]}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="${STARP}"/></svg></label>`).join("")}</div>
        <div class="rate-note" id="rateNote">${rating?NOTE[rating]:"별을 눌러 평가해 주세요"}</div></fieldset>
      <label class="fld"><span class="sr" id="revLabel">감상평</span>
        <textarea name="review" maxlength="100" rows="3" placeholder="한 줄 감상평 (100자)">${esc((e?.review||"").slice(0,100))}</textarea>
        <span class="count" id="cnt">${Math.min(100,(e?.review||"").length)} / 100</span></label>
      <div class="err" id="ferr" role="alert"></div>
      <div class="rf-actions">${e?`<button class="txt" type="button" data-remove="${k}" data-close>기록 삭제</button>`:""}<span class="spacer"></span>
        <button class="txt" type="button" data-close>취소</button><button class="btn-gold" type="submit">저장</button></div>
    </form>`);
  paint(panel.querySelector(".rf-poster canvas"),f,480,720,bannerPal(f));decorate(panel.querySelector(".rf-poster"),k,"w342");
  const form=$("bf"),ta=form.review;
  ta.oninput=()=>$("cnt").textContent=`${ta.value.length} / 100`;
  form.querySelectorAll(".rate label").forEach(l=>{l.onmouseenter=()=>$("rateNote").textContent=NOTE[l.htmlFor.slice(1)];
    l.onmouseleave=()=>$("rateNote").textContent=form.rating.value?NOTE[form.rating.value]:"별을 눌러 평가해 주세요"});
  form.onchange=ev=>{if(ev.target.name==="rating")$("rateNote").textContent=NOTE[ev.target.value]};
  form.onsubmit=ev=>{ev.preventDefault();const s="seen",r=+(form.rating.value||0);
    if(s==="seen"&&!r){$("ferr").textContent="별점을 골라 주세요.";return}
    const rec={...(e||{added:Date.now()}),key:k,ko:f.ko,en:f.en,y:f.y,n:f.n,status:s,review:ta.value.trim().slice(0,100),updated:Date.now()};
    if(s==="seen")rec.rating=r;else delete rec.rating;delete rec.date;
    DB.items[k]=rec;save();closePanel();renderAll();toast(s==="seen"?`〈${f.ko}〉 별점 ${r}점을 남겼어요`:`〈${f.ko}〉 찜 목록에 담았어요`)};
  (form.querySelector("[name=rating]:checked")||form.querySelector("[name=rating]")).focus();
}
function toggleWant(k){
  const f=info(k),e=entry(k);
  if(e?.status==="want"){delete DB.items[k];toast(`〈${f.ko}〉 찜 목록에서 뺐어요`)}
  else{DB.items[k]={...(e||{}),key:k,ko:f.ko,en:f.en,y:f.y,n:f.n,status:"want",added:Date.now(),updated:Date.now()};toast(`〈${f.ko}〉 찜 목록에 담았어요`)}
  save();renderAll();
}
function removeEntry(k){
  const e=entry(k),f=info(k);if(!e)return;
  if(e.status==="seen"&&!confirm(`〈${f.ko}〉의 평점과 리뷰를 삭제할까요?`))return;
  delete DB.items[k];save();renderAll();toast(`〈${f.ko}〉 기록을 삭제했어요`);
}
document.addEventListener("click",ev=>{
  const b=ev.target.closest("button,a[data-close]");if(!b)return;const d=b.dataset;
  if(d.genre){curGenre=d.genre;applyList();return}
  if(d.toggleWant){toggleWant(d.toggleWant);const h=document.querySelector(`.card[data-key="${CSS.escape(d.toggleWant)}"] .heart-act, #sheet .heart`);h?.classList.add("pop")}
  if(d.remove)removeEntry(d.remove);
  if("close" in d){closePanel();return}
  if(d.review)ballot(d.review,"seen");else if(d.edit)ballot(d.edit);
  else if(d.goto)show(d.goto,true);else if("leave" in d)leaveSheet();
});

/* ---------- backup ---------- */
$("exportBtn").onclick=()=>{const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([JSON.stringify({app:"mymoviestar",v:1,exported:new Date().toISOString(),items:DB.items},null,2)],{type:"application/json"}));
  a.download=`mymoviestar-${new Date().toISOString().slice(0,10)}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
$("importBtn").onclick=()=>$("importFile").click();
$("importFile").onchange=async ev=>{const file=ev.target.files[0];ev.target.value="";if(!file)return;
  try{const items=JSON.parse(await file.text()).items;let n=0;
    for(const [k,v] of Object.entries(items||{}))if(v?.key===k&&/^(want|seen)$/.test(v.status)){DB.items[k]=v;n++}
    save();renderAll();toast(`${n}편의 기록을 불러왔습니다`)}catch(e){toast("불러올 수 없는 파일입니다")}};

/* ---------- move records to another device: everything packed into one link ---------- */
const b64u=bytes=>{let s="";for(let i=0;i<bytes.length;i+=8192)s+=String.fromCharCode(...bytes.subarray(i,i+8192));return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"")};
const unb64u=t=>Uint8Array.from(atob(t.replace(/-/g,"+").replace(/_/g,"/")),c=>c.charCodeAt(0));
const pipe=(bytes,stream)=>new Response(new Blob([bytes]).stream().pipeThrough(stream)).arrayBuffer().then(b=>new Uint8Array(b));
async function packSync(){const raw=new TextEncoder().encode(JSON.stringify({v:1,items:DB.items}));
  return window.CompressionStream?"1"+b64u(await pipe(raw,new CompressionStream("deflate-raw"))):"0"+b64u(raw)}
async function unpackSync(t){const bytes=unb64u(t.slice(1));return JSON.parse(new TextDecoder().decode(t[0]==="1"?await pipe(bytes,new DecompressionStream("deflate-raw")):bytes)).items||{}}
$("syncBtn").onclick=async()=>{
  const n=entries().length;if(!n){toast("옮길 기록이 아직 없어요");return}
  const url=location.href.split("#")[0]+"#sync="+await packSync();
  const seen=entries().filter(e=>e.status==="seen").length;
  openPanel(`<h3 id="dlgTitle">다른 기기로 옮기기</h3>
    <p>이 링크를 휴대폰이나 다른 컴퓨터에서 열면 지금 기록(평점 ${seen}편 · 찜 ${n-seen}편)이 그 기기에 합쳐집니다. 카카오톡 '나와의 채팅' 등으로 보내 두면 편해요.</p>
    <input class="linkbox" id="syncLink" readonly value="${esc(url)}" aria-label="옮기기 링크">
    <div class="pactions">${navigator.share?`<button class="btn-gold" type="button" id="syncShare">공유</button>`:""}<button class="${navigator.share?"txt gold":"btn-gold"}" type="button" id="syncCopy">링크 복사</button><button class="txt" type="button" data-close>닫기</button></div>`);
  $("syncLink").onfocus=e=>e.target.select();
  $("syncCopy").onclick=async()=>{try{await navigator.clipboard.writeText(url);toast("링크를 복사했어요")}catch(e){$("syncLink").select();toast("링크를 길게 눌러 복사해 주세요")}};
  if($("syncShare"))$("syncShare").onclick=()=>navigator.share({title:"My Movie Star 기록",url}).catch(()=>{});
};
async function receiveSync(t){
  let items;try{items=await unpackSync(t)}catch(e){toast("링크가 손상되어 기록을 불러올 수 없어요");return}
  const list=Object.entries(items).filter(([k,v])=>v?.key===k&&/^(want|seen)$/.test(v.status));
  if(!list.length){toast("링크에 옮길 기록이 없어요");return}
  openPanel(`<h3 id="dlgTitle">기록 합치기</h3><p>다른 기기에서 보낸 기록 ${list.length}편을 이 기기에 합칠까요? 같은 영화는 더 최근에 고친 쪽이 남습니다.</p>
    <div class="pactions"><button class="btn-gold" type="button" id="syncMerge">합치기</button><button class="txt" type="button" data-close>취소</button></div>`);
  $("syncMerge").onclick=()=>{let n=0;for(const [k,v] of list){const cur=DB.items[k];if(!cur||(v.updated||0)>=(cur.updated||0)){DB.items[k]=v;n++}}
    save();closePanel();renderAll();show("hall",true);toast(`${n}편의 기록을 합쳤어요`)};
}

/* ---------- boot ---------- */
fetch(`data/films.json?v=${Math.floor(Date.now()/6e4)}`).then(r=>{if(!r.ok)throw 0;return r.json()}).then(d=>{
  FILMS=d.films.map((f,i)=>({...f,i}));BY_KEY=Object.fromEntries(FILMS.map(f=>[f.key,f]));RETIRED=d.retired||{};
  $("nomCount").textContent=`${FILMS.length}편`;
  const g=$("nomGrid");FILMS.forEach(f=>g.appendChild(card(f.key,true)));
  {let sv=store.get("mymoviestar.sort","pick");const old={new:["year","desc"],old:["year","asc"],short:["rt","asc"]};if(old[sv]){curDir=old[sv][1];sv=old[sv][0]}else curDir=store.get("mymoviestar.dir",DEFDIR[sv]||"desc");curSort=SORTS[sv]?sv:"pick";if(curDir!=="asc"&&curDir!=="desc")curDir="desc"}buildGenres();applyList();renderAll();route();
}).catch(()=>{$("nomGrid").innerHTML=`<div class="empty" style="grid-column:1/-1"><div class="big">Intermission</div><p>영화 목록을 불러오지 못했습니다. 잠시 후 새로고침해 주세요.</p></div>`;route()});
