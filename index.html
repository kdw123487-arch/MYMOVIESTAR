<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Movie Star</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://image.tmdb.org">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..800;1,6..96,400..700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap">
<style>
/* Layout: a printed gala programme — quiet masthead, three-section index, nominee plates sorted on demand, a winners roll, and a full-screen film page */
:root{
  --velvet:#140a0d;--velvet-2:#1e0f16;
  --gold:#d4b06a;--gold-soft:#8f7748;--ivory:#f1e8d6;--muted:#a89a8c;--faint:#6f645b;
  --line:rgba(212,176,106,.22);--line-strong:rgba(212,176,106,.5);
  --f-display:"Bodoni Moda","Didot","Times New Roman",serif;
  --f-sans:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scrollbar-gutter:stable}
body{margin:0;background:var(--velvet);color:var(--ivory);font-family:var(--f-sans);font-size:16px;line-height:1.7;
  background-image:radial-gradient(ellipse 50% 460px at 50% -60px,rgba(255,226,170,.14),transparent 70%);
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
button{font:inherit}
img{max-width:100%}
:focus-visible{outline:1px solid var(--gold);outline-offset:3px}
.wrap{max-width:1120px;margin:0 auto;padding:72px max(16px,env(safe-area-inset-right,0px)) 96px max(16px,env(safe-area-inset-left,0px))}

/* masthead */
.mast{text-align:center;display:grid;justify-items:center;gap:18px;padding-bottom:56px}
.eyebrow{font-size:11px;letter-spacing:.42em;text-transform:uppercase;color:var(--gold-soft)}
.mast h1{margin:0;font-family:var(--f-display);font-weight:400;font-size:clamp(44px,8.5vw,96px);line-height:.95;letter-spacing:-.01em}
.mast h1 em,.it{font-style:italic;color:var(--gold)}
.rule{display:flex;align-items:center;gap:14px;color:var(--gold-soft);font-size:14px;letter-spacing:.3em}
.rule::before,.rule::after{content:"";width:48px;height:1px;background:var(--line-strong)}
.btn-gold{font-size:14px;font-weight:500;letter-spacing:.14em;color:var(--velvet);background:linear-gradient(180deg,#e6cb8c,var(--gold) 60%,#b08d4c);border:0;border-radius:1px;padding:14px 30px;cursor:pointer}
.btn-gold:hover{filter:brightness(1.06)}
.mast .btn-gold{margin-top:14px}
.txt{font-size:13px;letter-spacing:.04em;color:var(--muted);background:none;border:0;padding:4px 0;cursor:pointer;border-bottom:1px solid transparent;text-decoration:none}
.txt:hover{color:var(--ivory);border-bottom-color:var(--line-strong)}
.txt.gold,.txt[aria-pressed="true"]{color:var(--gold)}

/* section index */
.tabs{display:flex;justify-content:center;gap:clamp(20px,6vw,72px);border-block:1px solid var(--line);position:sticky;top:0;z-index:20;background:rgba(20,10,13,.94);backdrop-filter:blur(6px)}
.tab{background:none;border:0;color:var(--muted);cursor:pointer;padding:16px 2px 14px;display:flex;align-items:baseline;gap:8px;border-bottom:1px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab .no{font-family:var(--f-display);font-style:italic;font-size:14px;color:var(--faint)}
.tab .t{font-size:14px;letter-spacing:.06em}
.tab .c{font-family:var(--f-display);font-size:13px;color:var(--gold-soft)}
.tab[aria-selected="true"]{color:var(--ivory);border-bottom-color:var(--gold)}
.tab[aria-selected="true"] .no{color:var(--gold)}

/* view heads + toolbar */
.view-head{text-align:center;display:grid;gap:8px;justify-items:center;margin:64px 0 40px}
.view-head .it{font-family:var(--f-display);font-size:15px;letter-spacing:.2em}
.view-head h2{margin:0;font-size:28px;font-weight:700;letter-spacing:.02em}
.view-head .line{font-size:12.5px;color:var(--faint);letter-spacing:.04em}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:-8px 0 32px;padding-bottom:12px;border-bottom:1px solid var(--line);font-size:13px;color:var(--faint)}
.sort{display:flex;gap:4px 18px;flex-wrap:wrap;justify-content:flex-end}
.sort button{background:none;border:0;border-bottom:1px solid transparent;color:var(--faint);font-size:13px;padding:3px 0;cursor:pointer}
.sort button:hover{color:var(--muted)}
.sort button[aria-pressed="true"]{color:var(--ivory);border-bottom-color:var(--gold)}

/* plates */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:44px 28px}
.card{display:flex;flex-direction:column;min-width:0}
.poster{position:relative;display:block;aspect-ratio:2/3;overflow:hidden;background:#000;outline:1px solid var(--line);outline-offset:-1px;color:inherit;text-decoration:none}
.poster canvas{display:block;width:100%;height:100%}
.poster .state{position:absolute;top:12px;left:14px;z-index:3;font-size:10px;letter-spacing:.3em;color:var(--gold);text-shadow:0 1px 6px rgba(0,0,0,.8)}
.poster .ptitle{position:absolute;left:14px;right:14px;bottom:14px;font-family:var(--f-display);font-style:italic;font-size:21px;line-height:1.15;color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.7);text-wrap:balance}
.poster .age-slot{position:absolute;top:10px;right:10px;z-index:3}
.card:hover .poster canvas,.card:hover img.pimg{filter:brightness(1.08)}
.card.is-seen .poster{outline-color:var(--line-strong)}
img.pimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .6s ease;z-index:1}
.has-img img.pimg{opacity:1}
.has-img .ptitle{display:none}
.poster.has-img::before{content:"";position:absolute;inset:0 0 auto;height:28%;background:linear-gradient(rgba(10,4,6,.55),transparent);z-index:2;pointer-events:none}

.body{padding:18px 0 0;display:flex;flex-direction:column;gap:8px;min-width:0;flex:1}
.body h3{margin:0;font-size:18px;line-height:1.4;font-weight:700}
.sub{font-size:12px;color:var(--faint);letter-spacing:.04em}
.award{font-size:12px;color:var(--gold-soft);line-height:1.5}
.plot{margin:2px 0 0;font-size:14px;color:var(--muted);line-height:1.65;font-weight:300}
.verdict{display:grid;gap:4px;margin-top:4px}
.aw{font-size:11px;letter-spacing:.24em;color:var(--gold)}
.verdict q{font-size:14px;line-height:1.65;quotes:"“" "”";font-weight:300}
.acts{margin-top:auto;padding-top:14px;border-top:1px solid var(--line);display:flex;gap:18px;flex-wrap:nowrap;align-items:center}
.spacer{flex:1}
.stars{letter-spacing:.12em;color:var(--gold);font-size:13px;white-space:nowrap}
.stars .off{color:rgba(212,176,106,.22)}
a.open{color:inherit;text-decoration:none;background-image:linear-gradient(var(--gold),var(--gold));background-size:0 1px;background-repeat:no-repeat;background-position:0 100%;transition:background-size .3s ease}
a.open:hover{background-size:100% 1px}

/* age rating mark (KMRB colours) */
.age{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;font:700 11px/1 var(--f-sans);letter-spacing:-.02em;color:#fff;box-shadow:0 0 0 2px rgba(255,255,255,.92),0 2px 8px rgba(0,0,0,.45);vertical-align:middle}
.age.ALL{background:#1f9a4a;font-size:9.5px}
.age.a12{background:#e3b10f;color:#1a1200}
.age.a15{background:#e8731c}
.age.a18{background:#d42b2b}
.age.lg{width:36px;height:36px;font-size:13px}.age.lg.ALL{font-size:11.5px}

.empty{margin:72px auto;max-width:420px;text-align:center;display:grid;gap:14px;justify-items:center;color:var(--muted)}
.empty .big{font-family:var(--f-display);font-style:italic;font-size:30px;color:var(--gold)}
.empty p{margin:0}

/* hall of fame */
.headline{display:grid;grid-template-columns:minmax(180px,250px) 1fr;gap:44px;align-items:center;padding:44px 0;border-block:1px solid var(--line-strong);margin-bottom:64px;background:radial-gradient(ellipse 40% 80% at 18% 50%,rgba(212,176,106,.10),transparent 70%)}
.headline .hl{display:grid;gap:12px;min-width:0}
.headline .eyebrow{color:var(--gold)}
.headline h3{margin:0;font-size:clamp(30px,4.4vw,44px);line-height:1.15}
.en{font-family:var(--f-display);font-style:italic;color:var(--gold-soft);font-size:18px}
.headline blockquote{margin:8px 0 0;font-size:17px;line-height:1.8;white-space:pre-wrap;max-width:52ch;font-weight:300}
.headline blockquote::before{content:"“";font-family:var(--f-display);color:var(--gold);font-size:40px;line-height:0;vertical-align:-.35em;margin-right:4px}
.roll-title{text-align:center;font-size:11px;letter-spacing:.42em;color:var(--gold-soft);margin-bottom:12px}
.roll{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.roll li{display:grid;grid-template-columns:56px 64px 1fr auto;gap:22px;align-items:center;padding:20px 0;border-bottom:1px solid var(--line)}
.roll .rk{font-family:var(--f-display);font-style:italic;font-size:30px;color:var(--gold);text-align:center}
.roll .th{position:relative;width:64px;aspect-ratio:2/3;overflow:hidden;outline:1px solid var(--line);outline-offset:-1px}
.roll .th canvas{width:100%;height:100%;display:block}
.roll .info{display:grid;gap:3px;min-width:0}
.roll h4{margin:0;font-size:17px;line-height:1.4}
.roll h4 span{font-family:var(--f-display);font-style:italic;font-weight:400;font-size:14px;color:var(--faint);margin-left:8px}
.roll .ml{display:flex;gap:12px;align-items:baseline}
.roll q{font-size:14px;color:var(--muted);quotes:"“" "”";overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:300}
.roll .ra{display:flex;gap:16px}
.data-tools{margin-top:72px;display:flex;gap:6px 22px;flex-wrap:wrap;justify-content:center;font-size:12px;color:var(--faint)}
.data-tools span{flex-basis:100%;text-align:center}

.foot{margin-top:96px;padding-top:28px;border-top:1px solid var(--line);font-size:12px;color:var(--faint);text-align:center;display:grid;gap:6px;justify-items:center}
.foot a{color:var(--muted)}
.foot img{display:block;opacity:.75;margin:6px 0}

/* modal stage (envelope, ballot) */
.stage{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:rgba(8,3,5,.9);padding:16px;overflow-y:auto}
.panel{width:min(520px,100%);background:var(--velvet-2);border:1px solid var(--line-strong);padding:36px 32px 30px;display:grid;gap:14px;animation:rise .7s cubic-bezier(.2,.8,.2,1)}
.panel.center{text-align:center}
.panel .wposter{position:relative;width:min(190px,54%);margin:6px auto;aspect-ratio:2/3;overflow:hidden;outline:1px solid var(--line);outline-offset:-1px}
.panel .wposter canvas{width:100%;height:100%;display:block}
.panel h3{margin:0;font-size:26px;line-height:1.25}
.panel p{margin:0;font-size:14.5px;color:var(--muted);text-align:left;line-height:1.75;font-weight:300}
.pactions{display:flex;gap:22px;justify-content:center;align-items:center;flex-wrap:wrap;margin-top:8px}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.form{display:grid;gap:20px;text-align:left}
.fld{display:grid;gap:6px;min-width:0;border:0;margin:0;padding:0}
.fld legend,.fld>span{font-size:11px;letter-spacing:.24em;color:var(--gold-soft);padding:0}
.fld textarea{width:100%;font:300 16px/1.7 var(--f-sans);color:var(--ivory);background:transparent;border:1px solid var(--line);padding:10px 12px;min-height:120px;resize:vertical}
.fld textarea:focus{outline:none;border-color:var(--gold)}
.seg{display:flex;gap:22px}
.seg label{font-size:14px;padding:4px 0;cursor:pointer;color:var(--faint);border-bottom:1px solid transparent}
.seg input,.rate input{position:absolute;opacity:0;pointer-events:none}
.seg label:has(input:checked){color:var(--ivory);border-bottom-color:var(--gold)}
.seg label:has(input:focus-visible){outline:1px solid var(--gold);outline-offset:3px}
.rate{display:flex;flex-direction:row-reverse;justify-content:flex-end;gap:4px}
.rate label{font-size:26px;line-height:1;cursor:pointer;color:rgba(212,176,106,.2);padding:2px}
.rate label:hover,.rate label:hover~label,.rate input:checked~label{color:var(--gold)}
.rate input:focus-visible+label{outline:1px solid var(--gold)}
.rate-note{font-size:12.5px;color:var(--muted)}
.err{font-size:13px;color:#e8a59b}.err:empty{display:none}
.toast{position:fixed;left:50%;bottom:max(28px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;font-size:13.5px;background:var(--velvet-2);color:var(--ivory);border:1px solid var(--line-strong);padding:11px 20px;max-width:calc(100% - 32px)}

/* film page */
.sheet{position:fixed;inset:0;z-index:40;background:var(--velvet);overflow-y:auto;overscroll-behavior:contain;animation:fadeIn .45s ease}
.sheet.leaving{animation:fadeOut .38s ease forwards;pointer-events:none}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeOut{from{opacity:1}to{opacity:0;transform:scale(.985)}}
.sheet-bar{position:sticky;top:0;z-index:5;padding:14px max(20px,env(safe-area-inset-left,0px));background:linear-gradient(rgba(20,10,13,.85),rgba(20,10,13,0));border-bottom:1px solid transparent;transition:background-color .25s,border-color .25s}
.sheet.scrolled .sheet-bar{background:rgba(20,10,13,.96);border-bottom-color:var(--line)}
.sheet-bar .txt{color:var(--ivory)}
.banner{position:relative;margin-top:-58px;aspect-ratio:5/2;max-height:66vh;overflow:hidden;background:#000}
.banner canvas{display:block;width:100%;height:100%;object-fit:cover}
.banner::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,10,13,.35) 0,transparent 30%,transparent 45%,var(--velvet) 100%)}
.cap{position:absolute;inset:auto 0 0;z-index:1;max-width:1120px;margin:0 auto;padding:0 calc(364px + max(16px,env(safe-area-inset-left,0px))) 40px max(16px,env(safe-area-inset-left,0px));display:grid;gap:8px}
.cap h2{margin:0;font-size:clamp(32px,5.4vw,60px);line-height:1.12;font-weight:700;letter-spacing:-.01em;text-wrap:balance;text-shadow:0 2px 24px rgba(0,0,0,.5)}
.cap .en{font-size:clamp(18px,2.2vw,26px);color:var(--gold)}
.sbody{max-width:1120px;margin:0 auto;padding:40px max(16px,env(safe-area-inset-left,0px)) 96px;display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:64px}
.sbody>main{grid-column:1;grid-row:1;min-width:0}
.side{grid-column:2;grid-row:1;display:grid;gap:28px;align-content:start;align-self:start;margin-top:-210px;position:relative;z-index:2}
.sposter{position:relative;aspect-ratio:2/3;overflow:hidden;background:#000;outline:1px solid var(--line);outline-offset:-1px;box-shadow:0 24px 60px rgba(0,0,0,.55)}
.sposter canvas{display:block;width:100%;height:100%}
.factsheet{margin:0 0 44px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-block:1px solid var(--line-strong)}
.factsheet div{padding:20px 20px 20px 0;display:grid;gap:8px;align-content:start;border-bottom:1px solid var(--line)}
.factsheet div:not(:nth-child(3n+1)):not(.full){padding-left:20px;border-left:1px solid var(--line)}
.factsheet .full{grid-column:1/-1;border-bottom:0}
.factsheet dt{font-size:14px;font-weight:500;letter-spacing:.14em;color:var(--gold)}
.factsheet dd{margin:0;font-size:18px;font-weight:500;line-height:1.5;display:flex;align-items:center;gap:10px}
.factsheet .full dd{font-weight:400;font-size:17px}
.sec{padding-bottom:36px;margin-bottom:36px;border-bottom:1px solid var(--line)}
.sec:last-child{border-bottom:0}
.sec h3{margin:0 0 14px;font-size:11px;font-weight:500;letter-spacing:.38em;color:var(--gold-soft)}
.sec p{margin:0;font-size:16.5px;line-height:1.9;max-width:62ch;font-weight:300}
.points{list-style:none;margin:0;padding:0;counter-reset:pt;display:grid;gap:14px}
.points li{counter-increment:pt;display:grid;grid-template-columns:36px 1fr;font-weight:300}
.points li::before{content:counter(pt,upper-roman);font-family:var(--f-display);font-style:italic;color:var(--gold)}
.mybox{display:grid;gap:12px}
.mybox blockquote{margin:0;font-size:16.5px;line-height:1.85;white-space:pre-wrap;font-weight:300}
.mybox .acts{border-top:0;padding-top:4px;margin-top:0}
.side h4{margin:0 0 10px;font-size:13px;font-weight:500;letter-spacing:.14em;color:var(--gold)}
.side .honor{font-size:15px;line-height:1.6;padding-bottom:22px;border-bottom:1px solid var(--line)}
.where{display:grid;gap:14px;padding-bottom:22px;border-bottom:1px solid var(--line)}
.where .kind{font-size:11px;letter-spacing:.24em;color:var(--faint);margin-bottom:6px}
.plats{display:flex;flex-wrap:wrap;gap:8px}
.plat{display:inline-flex;align-items:center;gap:8px;padding:5px 12px 5px 5px;border:1px solid var(--line);border-radius:999px;color:var(--ivory);text-decoration:none;font-size:13px;transition:border-color .2s}
.plat:hover{border-color:var(--gold)}
.plat img{width:24px;height:24px;border-radius:6px;display:block}
.where .note{font-size:12px;color:var(--faint);line-height:1.6}
.where .note a{color:var(--muted)}

@media (max-width:820px){
  .banner{aspect-ratio:4/3;max-height:none}
  .banner::after{background:linear-gradient(180deg,rgba(20,10,13,.4) 0,rgba(20,10,13,.2) 22%,rgba(20,10,13,.75) 58%,var(--velvet) 100%)}
  .cap{padding:0 calc(36% + 24px) 28px max(16px,env(safe-area-inset-left,0px))}
  .sbody{grid-template-columns:1fr;gap:0;padding-top:20px}
  .sbody>main,.side{grid-column:auto;grid-row:auto}
  .side{order:-1;margin-top:-170px;gap:20px;margin-bottom:28px}
  .sposter{width:36%;justify-self:end}
  .factsheet{grid-template-columns:1fr 1fr}
  .factsheet div,.factsheet div:not(:nth-child(3n+1)):not(.full){padding:16px 12px 16px 0;border-left:0}
  .factsheet div:nth-child(2n):not(.full){padding-left:14px;border-left:1px solid var(--line)}
  .factsheet dd{font-size:16px}
}
@media (max-width:640px){
  .wrap{padding-top:48px;padding-bottom:64px}
  .tabs{gap:18px}.tab .no{display:none}.tab .t{font-size:13.5px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:32px 16px}
  .poster .ptitle{font-size:16px}.body h3{font-size:16px}.plot{display:none}
  .acts{gap:12px}.long{display:none}
  .toolbar{flex-direction:column;align-items:flex-start}.sort{justify-content:flex-start}
  .headline{grid-template-columns:1fr;gap:24px;padding:32px 0;text-align:center}
  .headline .poster{width:min(220px,64%);justify-self:center}
  .roll li{grid-template-columns:36px 48px 1fr;gap:14px}
  .roll .rk{font-size:22px}.roll .th{width:48px}.roll .ra{grid-column:3}
  .panel{padding:28px 20px 24px}
}
@media (prefers-reduced-motion:reduce){.sheet,.sheet.leaving,.panel{animation:none}img.pimg{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header class="mast">
    <div class="eyebrow">The First Annual · 2026</div>
    <h1>My Movie <em>Star</em></h1>
    <div class="rule">나만의 영화 시상식</div>
    <button class="btn-gold" id="openEnv" type="button">봉투 열기</button>
  </header>

  <nav class="tabs" role="tablist" aria-label="섹션">
    <button class="tab" role="tab" id="tab-nominees" aria-controls="view-nominees" data-view="nominees"><span class="no">I</span><span class="t">후보작</span></button>
    <button class="tab" role="tab" id="tab-watch" aria-controls="view-watch" data-view="watch"><span class="no">II</span><span class="t">관람 예정</span><span class="c" id="cnt-watch"></span></button>
    <button class="tab" role="tab" id="tab-hall" aria-controls="view-hall" data-view="hall"><span class="no">III</span><span class="t">명예의 전당</span><span class="c" id="cnt-hall"></span></button>
  </nav>

  <section id="view-nominees" role="tabpanel" aria-labelledby="tab-nominees">
    <div class="view-head"><span class="it">Nominees</span><h2>후보작</h2></div>
    <div class="toolbar"><span id="nomCount"></span>
      <div class="sort" role="group" aria-label="정렬" id="sort">
        <button type="button" data-sort="pick">추천순</button><button type="button" data-sort="new">최신작</button><button type="button" data-sort="old">오래된 작품</button><button type="button" data-sort="title">제목순</button><button type="button" data-sort="short">러닝타임 짧은 순</button>
      </div></div>
    <div class="grid" id="nomGrid"></div>
  </section>

</div>

<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sTitle"></div>
<div class="stage" id="stage" hidden role="dialog" aria-modal="true" aria-labelledby="dlgTitle"><div class="panel" id="panel"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script>
"use strict";
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const clip=(s,n)=>(s=String(s)).length>n?s.slice(0,n).trimEnd()+"…":s;
const AWARDS={5:"대상",4:"최우수작품상",3:"우수작품상",2:"특별언급",1:"황금 라즈베리"};
const stars=n=>`<span class="stars" aria-label="별점 ${n}점">${"★".repeat(n)}<span class="off">${"★".repeat(5-n)}</span></span>`;
let toastT;function toast(m){const t=$("toast");t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2400)}
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}}};

/* ---------- data ---------- */
let FILMS=[],BY_KEY={},RETIRED={};
const DB=store.get("mymoviestar.v1",{items:{}});if(!DB.items)DB.items={};
const entry=k=>DB.items[k];
const entries=()=>Object.values(DB.items);
const save=()=>store.set("mymoviestar.v1",DB)||toast("이 브라우저에서는 저장할 수 없어요. 백업을 내보내 두세요.");
/* a film for any key: listed nominee, retired nominee, or an old custom record */
function info(k){const e=entry(k)||{};return BY_KEY[k]||{key:k,...RETIRED[k],...(e.ko?{ko:e.ko,en:e.en,y:e.y,n:e.n}:{})}}

/* ---------- painted fallback art ---------- */
const MOTIFS=["sun","waves","bands","rings","split","peaks","arch","rays","grid","dots","trees"];
const PALS=[["#e9e6df","#8d8a84","#1b1b1b"],["#c9a46a","#2a1a12","#050302"],["#9fb7cc","#2e4257","#0b1118"],["#e7c9a9","#c0583c","#24324a"],["#cfe2a8","#3e6a4a","#0f1c14"],["#f2c14e","#3b3f8f","#14112b"]];
function hash(s){let h=7;for(const ch of String(s))h=(h*31+ch.codePointAt(0))%100003;return h}
function look(f){const h=hash(f.key||f.ko);return{seed:h,pal:f.pal||PALS[h%PALS.length],m:f.m||MOTIFS[(h>>3)%MOTIFS.length]}}
function paint(cv,f,W=480,H=720){
  const L=look(f);cv.width=W;cv.height=H;const x=cv.getContext("2d"),[a,b,c]=L.pal,Z=Math.min(W,H*.75);
  let s=L.seed*9301+49297;const r=()=>((s=(s*9301+49297)%233280)/233280);
  const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,b);g.addColorStop(1,c);x.fillStyle=g;x.fillRect(0,0,W,H);x.fillStyle=a;x.strokeStyle=a;
  const k=n=>Array.from({length:Math.round(n)},(_,i)=>i),cx=W/2,cy=H*.42;
  switch(L.m){
    case"sun":x.globalAlpha=.9;x.beginPath();x.arc(cx,cy,Z*.28,0,7);x.fill();x.globalAlpha=1;x.fillStyle=c;k(6).forEach(i=>x.fillRect(0,cy+i*22,W,8+i*2));break;
    case"waves":x.lineWidth=3;k(16).forEach(i=>{x.globalAlpha=.25+i*.04;x.beginPath();for(let t=0;t<=W;t+=8)x.lineTo(t,H*.35+i*20+Math.sin(t/40+i*.6)*10);x.stroke()});break;
    case"bands":k(9).forEach(i=>{x.globalAlpha=.15+r()*.5;x.fillRect(0,i*H/9+r()*20,W,H/18+r()*20)});break;
    case"rings":x.lineWidth=2;k(14).forEach(i=>{x.globalAlpha=1-i*.06;x.beginPath();x.arc(cx,H*.45,(i+1)*18,0,7);x.stroke()});break;
    case"split":x.globalAlpha=.85;x.fillRect(0,0,cx,H);x.fillStyle=b;x.beginPath();x.arc(cx,cy,70,0,7);x.fill();break;
    case"peaks":k(4).forEach(i=>{x.globalAlpha=.25+i*.2;x.beginPath();x.moveTo(-20,H);for(let t=-20;t<=W+40;t+=60)x.lineTo(t,H*.45+i*55-r()*90);x.lineTo(W+20,H);x.fill()});break;
    case"arch":x.globalAlpha=.9;x.beginPath();x.moveTo(cx-Z*.28,H*.85);x.lineTo(cx-Z*.28,cy);x.arc(cx,cy,Z*.28,Math.PI,0);x.lineTo(cx+Z*.28,H*.85);x.fill();x.fillStyle=c;x.globalAlpha=.8;x.fillRect(cx-Z*.03,H*.55,Z*.06,H*.3);break;
    case"rays":x.lineWidth=2;k(40).forEach(i=>{const t=-Math.PI*.95+i*Math.PI*.9/40+Math.PI/2;x.globalAlpha=.2+r()*.5;x.beginPath();x.moveTo(cx,H*.12);x.lineTo(cx+Math.cos(t)*H,H*.12+Math.sin(t)*H);x.stroke()});break;
    case"grid":for(let i=0;i<Math.floor((W-20)/56);i++)for(let j=0;j<13;j++){x.globalAlpha=r()<.18?.95:.12;x.fillRect(30+i*56,40+j*52,40,36)}break;
    case"dots":k(130*W/480).forEach(()=>{x.globalAlpha=.3+r()*.7;x.beginPath();x.arc(r()*W,r()*H*.8,1+r()*4,0,7);x.fill()});x.globalAlpha=.9;x.fillStyle=c;x.beginPath();x.moveTo(0,H);x.quadraticCurveTo(cx,H*.6,W,H);x.fill();break;
    case"trees":k(26*W/480).forEach(()=>{const tx=r()*W,th=H*(.3+r()*.5),tw=10+r()*26;x.globalAlpha=.25+r()*.6;x.beginPath();x.moveTo(tx,H-th);x.lineTo(tx-tw,H);x.lineTo(tx+tw,H);x.fill()});
  }
  x.globalAlpha=1;const v=x.createRadialGradient(cx,H/2,H*.2,cx,H/2,H*.75);v.addColorStop(0,"rgba(0,0,0,0)");v.addColorStop(1,"rgba(0,0,0,.55)");x.fillStyle=v;x.fillRect(0,0,W,H);
  for(let i=0;i<2200*W/480;i++){x.fillStyle=r()<.5?"rgba(255,255,255,.05)":"rgba(0,0,0,.08)";x.fillRect(r()*W,r()*H,1.5,1.5)}
}

/* ---------- TMDB: poster, Korean age rating, where to watch (JustWatch) ---------- */
const TMDB_KEY="831c75aabec03e476b7e4b64be940d5e";
const IMG="https://image.tmdb.org/t/p/",TC_KEY="mymoviestar.tmdb.v2",DAY=864e5;
const TC=store.get(TC_KEY,{});
const tq=[],tp={};let tActive=0;
function pump(){while(tActive<4&&tq.length){tActive++;tq.shift()().finally(()=>{tActive--;pump()})}}
async function api(path,params={}){
  const u=new URL("https://api.themoviedb.org/3"+path),h={accept:"application/json"};
  for(const [k,v] of Object.entries(params))if(v!=null&&v!=="")u.searchParams.set(k,v);
  if(TMDB_KEY.length>40)h.Authorization="Bearer "+TMDB_KEY;else u.searchParams.set("api_key",TMDB_KEY);
  const r=await fetch(u,{headers:h});if(!r.ok)throw new Error("tmdb "+r.status);return r.json();
}
const yr=s=>+(String(s||"").match(/\d{4}/)||[0])[0];
function ageOf(m){
  const kr=(m.release_dates?.results||[]).find(x=>x.iso_3166_1==="KR");
  const c=(kr?.release_dates||[]).map(d=>String(d.certification||"").trim()).find(Boolean);
  if(!c)return null;if(/^all|전체/i.test(c))return"ALL";if(/12/.test(c))return"12";if(/15/.test(c))return"15";if(/18|19|청/.test(c))return"18";return null;
}
async function resolve(f){
  let id=f.tmdb,m=null;const extra={append_to_response:"release_dates,watch/providers",language:"en-US"};
  if(id){m=await api(`/movie/${id}`,extra).catch(()=>null);if(m&&f.y&&Math.abs(yr(m.release_date)-yr(f.y))>1)m=null}
  if(!m){const q=f.en||f.ko;let s=await api("/search/movie",{query:q,year:yr(f.y)||"",include_adult:"false"});
    if(!s.results?.length&&f.y)s=await api("/search/movie",{query:q,include_adult:"false"});
    const hit=(s.results||[]).find(x=>x.poster_path);if(hit)m=await api(`/movie/${hit.id}`,extra)}
  if(!m)return{t:Date.now()};
  const w=m["watch/providers"]?.results?.KR||{},pick=a=>(a||[]).map(p=>({id:p.provider_id,n:p.provider_name,l:p.logo_path}));
  return{t:Date.now(),id:m.id,p:m.poster_path,age:ageOf(m),w:{link:w.link||"",sub:pick(w.flatrate),rent:pick([...(w.rent||[]),...(w.buy||[])].filter((p,i,a)=>a.findIndex(q=>q.provider_id===p.provider_id)===i))}};
}
function tmdb(key){
  const f=info(key),sig=[f.tmdb,f.en,f.y].join("|"),c=TC[key];
  if(c&&c.s===sig&&Date.now()-c.t<(c.id?7:1)*DAY)return Promise.resolve(c);
  if(!TMDB_KEY||!(f.en||f.ko))return Promise.resolve(c||{});
  return tp[key]||(tp[key]=new Promise(res=>{tq.push(()=>resolve(f).then(d=>{d.s=sig;TC[key]=d;store.set(TC_KEY,TC);res(d)}).catch(()=>res(c||{})).finally(()=>delete tp[key]));pump()}));
}
const AGE={ALL:["ALL","전체 관람가"],12:["12","12세 이상 관람가"],15:["15","15세 이상 관람가"],18:["18","청소년 관람불가"]};
const ageMark=(a,lg)=>AGE[a]?`<span class="age ${a==="ALL"?"ALL":"a"+a}${lg?" lg":""}" role="img" aria-label="${AGE[a][1]}" title="${AGE[a][1]}">${AGE[a][0]}</span>`:"";
/* fill a poster box: real poster + age mark, once TMDB answers */
function decorate(box,key,size="w342"){
  if(!box)return;const f=info(key);
  const put=(d)=>{if(!box.isConnected)return;
    const slot=box.querySelector(".age-slot");if(slot)slot.innerHTML=ageMark(f.age||d.age);
    if(!d.p)return;let img=box.querySelector("img.pimg");if(img&&img.dataset.p===d.p)return;
    if(!img){img=document.createElement("img");img.className="pimg";img.alt="";img.decoding="async";img.loading="lazy";box.appendChild(img)}
    img.dataset.p=d.p;img.onload=()=>box.classList.add("has-img");img.onerror=()=>{img.remove();box.classList.remove("has-img")};img.src=IMG+size+d.p};
  tmdb(key).then(put);
}
/* streaming services: search links for the services we know, otherwise the TMDB/JustWatch page */
const PLAT=[[/netflix/i,q=>"https://www.netflix.com/search?q="+q],[/watcha/i,q=>"https://watcha.com/search?query="+q],[/wavve/i,q=>"https://www.wavve.com/search?searchWord="+q],
  [/tving/i,q=>"https://www.tving.com/search?keyword="+q],[/apple/i,q=>"https://tv.apple.com/kr/search?term="+q],[/google/i,q=>"https://play.google.com/store/search?c=movies&q="+q]];
function platLink(p,f,w){const m=PLAT.find(([re])=>re.test(p.n));return m?m[1](encodeURIComponent(f.ko)):(w.link||"https://www.justwatch.com/kr")}

/* ---------- nominees ---------- */
const cards={};
function card(key,watch){
  const f=info(key),el=document.createElement("article");el.className="card";
  el.innerHTML=`<a class="poster" href="#film/${encodeURIComponent(key)}" tabindex="-1" aria-hidden="true"><canvas></canvas><span class="state"></span><span class="age-slot"></span><span class="ptitle">${esc(f.en||f.ko)}</span></a>
    <div class="body"><h3><a class="open" href="#film/${encodeURIComponent(key)}">${esc(f.ko)}</a></h3><div class="sub">${[f.y,f.n].filter(Boolean).map(esc).join(" · ")}</div>
    ${f.aw?`<div class="award">${esc(f.aw)}</div>`:""}<div class="slot"></div><div class="acts"></div></div>`;
  paint(el.querySelector("canvas"),f);decorate(el.querySelector(".poster"),key);
  if(watch)sync(el,key,true);else{cards[key]=el;sync(el,key)}
  return el;
}
function sync(el,key,watch){
  const f=info(key),e=entry(key),seen=e?.status==="seen",want=e?.status==="want";
  el.querySelector(".state").textContent=seen?AWARDS[e.rating]:want&&!watch?"관람 예정":"";
  el.classList.toggle("is-seen",seen);
  el.querySelector(".slot").innerHTML=seen?`<div class="verdict">${stars(e.rating)}${e.review?`<q>${esc(clip(e.review,70))}</q>`:""}</div>`:f.p?`<p class="plot">${esc(f.p)}</p>`:"";
  el.querySelector(".acts").innerHTML=seen?`<button class="txt" type="button" data-edit="${key}">심사평 수정</button>`
    :watch?`<button class="txt" type="button" data-toggle-want="${key}">빼기</button><span class="spacer"></span><button class="txt gold" type="button" data-review="${key}">심사하기</button>`
    :`<button class="txt" type="button" data-toggle-want="${key}" aria-pressed="${!!want}">${want?"관람 예정 ✓":'<span class="long">관람 예정에 </span>담기'}</button><span class="spacer"></span><button class="txt gold" type="button" data-review="${key}">심사<span class="long">하기</span></button>`;
}
const SORTS={pick:()=>0,new:(a,b)=>yr(b.y)-yr(a.y),old:(a,b)=>yr(a.y)-yr(b.y),title:(a,b)=>a.ko.localeCompare(b.ko,"ko"),short:(a,b)=>(a.rt||999)-(b.rt||999)};
function sortNominees(by){
  if(!SORTS[by])by="pick";store.set("mymoviestar.sort",by);
  $("sort").querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.sort===by));
  const g=$("nomGrid");[...FILMS].sort((a,b)=>SORTS[by](a,b)||a.i-b.i).forEach(f=>g.appendChild(cards[f.key]));
}

/* ---------- watchlist & hall ---------- */
const empty=(big,msg)=>`<div class="empty"><div class="big">${big}</div><p>${msg}</p><button class="txt gold" type="button" data-goto="nominees">후보작 둘러보기</button></div>`;
function renderWatch(){
  const g=$("watchGrid"),list=entries().filter(e=>e.status==="want").sort((a,b)=>(b.added||0)-(a.added||0));
  g.replaceChildren();g.style.display=list.length?"":"block";
  if(!list.length){g.innerHTML=empty("Empty Seats","아직 관람 예정인 작품이 없습니다.");return}
  list.forEach(e=>g.appendChild(card(e.key,true)));
}
function renderHall(){
  const top=$("hallTop"),roll=$("hallRoll"),seen=entries().filter(e=>e.status==="seen").sort((a,b)=>b.rating-a.rating||(b.updated||0)-(a.updated||0));
  top.innerHTML=roll.innerHTML="";$("hallStats").textContent=seen.length?`헌액 ${seen.length}편 · 평균 ${(seen.reduce((s,e)=>s+e.rating,0)/seen.length).toFixed(1)}`:"";
  if(!seen.length){top.innerHTML=empty("The Hall Awaits","작품을 심사하면 이곳에 이름이 새겨집니다.");return}
  const ch=seen[0],f=info(ch.key),href="#film/"+encodeURIComponent(ch.key);
  top.innerHTML=`<article class="headline"><a class="poster" href="${href}" tabindex="-1" aria-hidden="true"><canvas></canvas><span class="age-slot"></span><span class="ptitle">${esc(f.en||f.ko)}</span></a>
    <div class="hl"><div class="eyebrow">Best Picture · ${AWARDS[ch.rating]}</div><h3><a class="open" href="${href}">${esc(f.ko)}</a></h3>
    ${f.en&&f.en!==f.ko?`<div class="en">${esc(f.en)}${f.y?`, ${esc(f.y)}`:""}</div>`:""}<div>${stars(ch.rating)}</div>
    ${ch.review?`<blockquote>${esc(ch.review)}</blockquote>`:""}<div><button class="txt" type="button" data-edit="${ch.key}">심사평 수정</button></div></div></article>`;
  paint(top.querySelector("canvas"),f);decorate(top.querySelector(".poster"),ch.key,"w500");
  if(seen.length<2)return;
  roll.innerHTML=`<div class="roll-title">WINNERS</div><ol class="roll"></ol>`;
  seen.slice(1).forEach((e,i)=>{const f=info(e.key),li=document.createElement("li");
    li.innerHTML=`<div class="rk">${i+2}</div><div class="th"><canvas></canvas></div>
      <div class="info"><h4><a class="open" href="#film/${encodeURIComponent(e.key)}">${esc(f.ko)}</a>${f.en&&f.en!==f.ko?`<span>${esc(f.en)}</span>`:""}</h4>
      <div class="ml"><span class="aw">${AWARDS[e.rating]}</span>${stars(e.rating)}</div>${e.review?`<q>${esc(e.review)}</q>`:""}</div>
      <div class="ra"><button class="txt" type="button" data-edit="${e.key}">수정</button><button class="txt" type="button" data-remove="${e.key}" aria-label="${esc(f.ko)} 기록 삭제">삭제</button></div>`;
    paint(li.querySelector("canvas"),f);decorate(li.querySelector(".th"),e.key,"w154");roll.querySelector("ol").appendChild(li)});
}
function renderAll(){
  FILMS.forEach(f=>sync(cards[f.key],f.key));renderWatch();renderHall();
  $("cnt-watch").textContent=entries().filter(e=>e.status==="want").length||"";$("cnt-hall").textContent=entries().filter(e=>e.status==="seen").length||"";
  if(sheetKey)renderSheet(sheetKey);
}

/* ---------- film page ---------- */
const sheet=$("sheet");let sheetKey=null,sheetT=null,curView="nominees",navs=0;
sheet.addEventListener("scroll",()=>sheet.classList.toggle("scrolled",sheet.scrollTop>40),{passive:true});
function renderSheet(k){
  const f=info(k),e=entry(k),seen=e?.status==="seen",want=e?.status==="want",listed=!!BY_KEY[k];
  const fx=(t,v,full)=>v?`<div${full?' class="full"':""}><dt>${t}</dt><dd>${v}</dd></div>`:"";
  sheet.innerHTML=`<div class="sheet-bar"><button class="txt" type="button" data-leave>← 시상식으로</button></div>
    <header class="banner"><canvas aria-hidden="true"></canvas><div class="cap"><h2 id="sTitle">${esc(f.ko)}</h2>${f.en&&f.en!==f.ko?`<div class="en">${esc(f.en)}</div>`:""}</div></header>
    <div class="sbody">
      <aside class="side"><div class="sposter" aria-hidden="true"><canvas></canvas></div>
        ${f.aw?`<div class="honor"><h4>수상</h4>${esc(f.aw)}</div>`:""}
        <div class="where" id="where"><h4>볼 수 있는 곳</h4><div class="note">불러오는 중…</div></div></aside>
      <main><dl class="factsheet">${fx("감독",esc(f.dir))+fx("개봉",esc(f.y))+fx("러닝타임",f.rt?f.rt+"분":"")+fx("장르",esc(f.g))+fx("제작 국가",esc(f.n))+`<div id="ageCell" hidden><dt>관람등급</dt><dd></dd></div>`+fx("출연",esc(f.cast),1)}</dl>
        ${f.s?`<section class="sec"><h3>SYNOPSIS</h3><p>${esc(f.s)}</p></section>`:""}
        ${f.w?`<section class="sec"><h3>WHY IT'S NOMINATED</h3><p>${esc(f.w)}</p></section>`:""}
        ${f.pt?`<section class="sec"><h3>WHAT TO WATCH FOR</h3><ol class="points">${f.pt.map(x=>`<li>${esc(x)}</li>`).join("")}</ol></section>`:""}
        <section class="sec"><h3>MY BALLOT</h3><div class="mybox">${seen
          ?`<div><span class="aw">${AWARDS[e.rating]}</span> ${stars(e.rating)}</div>${e.review?`<blockquote>${esc(e.review)}</blockquote>`:""}<div class="acts"><button class="txt gold" type="button" data-edit="${k}">심사평 수정</button></div>`
          :`<p style="color:var(--faint)">아직 심사하지 않은 작품입니다.</p><div class="acts">${listed?`<button class="txt" type="button" data-toggle-want="${k}" aria-pressed="${!!want}">${want?"관람 예정 ✓":"관람 예정에 담기"}</button>`:""}<button class="txt gold" type="button" data-review="${k}">심사하기</button></div>`}</div></section>
      </main></div>`;
  paint(sheet.querySelector(".banner canvas"),f,1600,640);paint(sheet.querySelector(".sposter canvas"),f);decorate(sheet.querySelector(".sposter"),k,"w500");
  tmdb(k).then(d=>{if(sheetKey!==k)return;
    const a=f.age||d.age,cell=$("ageCell");if(a&&cell){cell.hidden=false;cell.querySelector("dd").innerHTML=ageMark(a,1)+AGE[a][1]}
    const w=d.w,box=$("where");if(!box)return;
    const row=(t,list)=>list.length?`<div><div class="kind">${t}</div><div class="plats">${list.map(p=>`<a class="plat" href="${esc(platLink(p,f,w))}" target="_blank" rel="noopener">${p.l?`<img src="${IMG}w92${p.l}" alt="" width="24" height="24" loading="lazy">`:""}${esc(p.n)}</a>`).join("")}</div></div>`:"";
    box.innerHTML=`<h4>볼 수 있는 곳</h4>`+(w&&(w.sub.length||w.rent.length)?row("구독",w.sub)+row("대여 · 구매",w.rent.slice(0,6))+`<div class="note">국내 기준 · 정보 제공 JustWatch${w.link?` · <a href="${esc(w.link)}" target="_blank" rel="noopener">전체 보기</a>`:""}</div>`
      :`<div class="note">${TMDB_KEY&&d.t?"국내 스트리밍 정보가 없습니다.":"스트리밍 정보를 불러오지 못했습니다."}</div>`);
  });
}
function openSheet(k){
  const was=sheetKey;sheetKey=k;clearTimeout(sheetT);sheet.classList.remove("leaving");renderSheet(k);
  if(sheet.hidden){sheet.hidden=false;document.documentElement.style.overflow="hidden"}
  if(was!==k){sheet.scrollTop=0;sheet.classList.remove("scrolled");sheet.querySelector("[data-leave]").focus()}
}
function closeSheet(){
  if(sheet.hidden||!sheetKey)return;const k=sheetKey;sheetKey=null;
  const done=()=>{if(sheetKey)return;sheet.hidden=true;sheet.classList.remove("leaving");sheet.replaceChildren();document.documentElement.style.overflow="";
    const back=document.querySelector(`a.open[href="#film/${CSS.escape(encodeURIComponent(k))}"]`);if(back?.offsetParent)back.focus({preventScroll:true})};
  if(matchMedia("(prefers-reduced-motion: reduce)").matches)done();else{sheet.classList.add("leaving");sheetT=setTimeout(done,380)}
}
const leaveSheet=()=>navs>0?history.back():(history.replaceState(null,"","#"+curView),route());

/* ---------- tabs & routing ---------- */
const VIEWS=["nominees","watch","hall"];
function show(v,push){
  if(!VIEWS.includes(v))v="nominees";curView=v;
  VIEWS.forEach(k=>{$("view-"+k).hidden=k!==v;const t=$("tab-"+k);t.setAttribute("aria-selected",k===v);t.tabIndex=k===v?0:-1});
  if(push)history.replaceState(null,"","#"+v);
}
function route(){
  const h=decodeURIComponent(location.hash.slice(1));
  if(h.startsWith("film/")){const k=h.slice(5);if(BY_KEY[k]||entry(k)){openSheet(k);return}}
  closeSheet();show(h);
}
document.querySelector(".tabs").addEventListener("click",e=>{const t=e.target.closest(".tab");if(t)show(t.dataset.view,true)});
document.querySelector(".tabs").addEventListener("keydown",e=>{if(!/Arrow(Left|Right)/.test(e.key))return;
  const nx=VIEWS[(VIEWS.indexOf(curView)+(e.key==="ArrowRight"?1:2))%3];show(nx,true);$("tab-"+nx).focus()});
addEventListener("hashchange",()=>{navs++;route()});

/* ---------- modal stage ---------- */
const stage=$("stage"),panel=$("panel");let lastFocus=null;
function openPanel(html,center){lastFocus=document.activeElement;panel.className="panel"+(center?" center":"");void panel.offsetWidth;panel.innerHTML=html;stage.hidden=false;document.documentElement.style.overflow="hidden"}
function closePanel(){stage.hidden=true;document.documentElement.style.overflow=sheetKey?"hidden":"";lastFocus?.isConnected&&lastFocus.focus()}
stage.addEventListener("click",e=>{if(e.target===stage)closePanel()});
document.addEventListener("keydown",e=>{
  if(stage.hidden){if(e.key==="Escape"&&sheetKey)leaveSheet();return}
  if(e.key==="Escape")closePanel();
  if(e.key==="Tab"){const f=[...panel.querySelectorAll("button,input,textarea,a[href]")].filter(n=>n.offsetParent);if(!f.length)return;
    const a=f[0],z=f.at(-1);if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus()}else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus()}}
});
let lastPick=null;
function envelope(){
  const pool=[...new Set(entries().filter(e=>e.status==="want").map(e=>e.key).concat(FILMS.filter(f=>entry(f.key)?.status!=="seen").map(f=>f.key)))];
  if(!pool.length){openPanel(`<div class="eyebrow">And the winner is</div><h3 id="dlgTitle">모든 후보를 심사하셨습니다</h3><div class="pactions"><button class="txt" type="button" data-close>닫기</button></div>`,true);return}
  let k;do{k=pool[Math.floor(Math.random()*pool.length)]}while(pool.length>1&&k===lastPick);lastPick=k;
  const f=info(k),want=entry(k)?.status==="want";
  openPanel(`<div class="eyebrow">And the winner is</div><div class="wposter"><canvas></canvas></div>
    <h3 id="dlgTitle">${esc(f.ko)}</h3>${f.en?`<div class="en">${esc(f.en)}${f.y?`, ${esc(f.y)}`:""}</div>`:""}
    ${f.aw?`<div class="award">${esc(f.aw)}</div>`:""}${f.p?`<p>${esc(f.p)} ${esc(f.w||"")}</p>`:""}
    <div class="pactions"><button class="btn-gold" type="button" id="again">다시 열기</button><a class="txt gold" href="#film/${encodeURIComponent(k)}" data-close>자세히 보기</a>
    ${want?"":`<button class="txt" type="button" data-toggle-want="${k}" data-close>관람 예정에 담기</button>`}<button class="txt" type="button" data-close>닫기</button></div>`,true);
  paint(panel.querySelector("canvas"),f);decorate(panel.querySelector(".wposter"),k);$("again").onclick=envelope;$("again").focus();
}
const NOTE={1:"황금 라즈베리",2:"특별언급",3:"우수작품상",4:"최우수작품상",5:"대상"};
function ballot(k,status){
  const f=info(k),e=entry(k),st=status||e?.status||"seen",rating=e?.rating||0;
  openPanel(`<div class="eyebrow">Ballot · 심사표</div><h3 id="dlgTitle">${esc(f.ko)}</h3>${f.en?`<div class="en">${esc(f.en)}${f.y?`, ${esc(f.y)}`:""}</div>`:""}
    <form class="form" id="bf" novalidate>
      <fieldset class="fld"><legend>구분</legend><div class="seg">
        <label><input type="radio" name="status" value="want" ${st==="want"?"checked":""}><span>관람 예정</span></label>
        <label><input type="radio" name="status" value="seen" ${st==="seen"?"checked":""}><span>관람 완료</span></label></div></fieldset>
      <fieldset class="fld" id="rateBox" ${st==="seen"?"":"hidden"}><legend>시상</legend>
        <div class="rate">${[5,4,3,2,1].map(n=>`<input type="radio" name="rating" id="r${n}" value="${n}" ${rating===n?"checked":""}><label for="r${n}" aria-label="${n}점 ${NOTE[n]}">★</label>`).join("")}</div>
        <div class="rate-note" id="rateNote">${rating?NOTE[rating]:"별점으로 시상 등급을 정합니다"}</div></fieldset>
      <label class="fld"><span id="revLabel">${st==="seen"?"심사평":"메모"}</span><textarea name="review" maxlength="2000">${esc(e?.review||"")}</textarea></label>
      <div class="err" id="ferr" role="alert"></div>
      <div class="pactions"><button class="btn-gold" type="submit">${st==="seen"?"헌액하기":"저장"}</button>${e?`<button class="txt" type="button" data-remove="${k}" data-close>삭제</button>`:""}<button class="txt" type="button" data-close>취소</button></div>
    </form>`);
  const form=$("bf");
  form.onchange=ev=>{const s=form.status.value;$("rateBox").hidden=s!=="seen";$("revLabel").textContent=s==="seen"?"심사평":"메모";
    form.querySelector("[type=submit]").textContent=s==="seen"?"헌액하기":"저장";if(ev.target.name==="rating")$("rateNote").textContent=NOTE[ev.target.value]};
  form.onsubmit=ev=>{ev.preventDefault();const s=form.status.value,r=+(form.rating.value||0);
    if(s==="seen"&&!r){$("ferr").textContent="별점을 골라 주세요.";return}
    const rec={...(e||{added:Date.now()}),key:k,ko:f.ko,en:f.en,y:f.y,n:f.n,status:s,review:form.review.value.trim(),updated:Date.now()};
    if(s==="seen")rec.rating=r;else delete rec.rating;delete rec.date;
    DB.items[k]=rec;save();closePanel();renderAll();toast(s==="seen"?`〈${f.ko}〉 ${AWARDS[r]} 수상`:`〈${f.ko}〉 관람 예정에 담았습니다`)};
  form.querySelector("[name=status]:checked").focus();
}
function toggleWant(k){
  const f=info(k),e=entry(k);
  if(e?.status==="want"){delete DB.items[k];toast(`〈${f.ko}〉 관람 예정에서 뺐습니다`)}
  else{DB.items[k]={...(e||{}),key:k,ko:f.ko,en:f.en,y:f.y,n:f.n,status:"want",added:Date.now(),updated:Date.now()};toast(`〈${f.ko}〉 관람 예정에 담았습니다`)}
  save();renderAll();
}
function removeEntry(k){
  const e=entry(k),f=info(k);if(!e)return;
  if(e.status==="seen"&&!confirm(`〈${f.ko}〉의 심사 기록을 삭제할까요?`))return;
  delete DB.items[k];save();renderAll();toast(`〈${f.ko}〉 기록을 삭제했습니다`);
}
document.addEventListener("click",ev=>{
  const b=ev.target.closest("button,a[data-close]");if(!b)return;const d=b.dataset;
  if(d.toggleWant)toggleWant(d.toggleWant);
  if(d.remove)removeEntry(d.remove);
  if("close" in d){closePanel();return}
  if(d.review)ballot(d.review,"seen");else if(d.edit)ballot(d.edit);
  else if(d.goto)show(d.goto,true);else if("leave" in d)leaveSheet();else if(d.sort)sortNominees(d.sort);
});
$("openEnv").onclick=envelope;

/* ---------- backup ---------- */
$("exportBtn").onclick=()=>{const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([JSON.stringify({app:"mymoviestar",v:1,exported:new Date().toISOString(),items:DB.items},null,2)],{type:"application/json"}));
  a.download=`mymoviestar-${new Date().toISOString().slice(0,10)}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
$("importBtn").onclick=()=>$("importFile").click();
$("importFile").onchange=async ev=>{const file=ev.target.files[0];ev.target.value="";if(!file)return;
  try{const items=JSON.parse(await file.text()).items;let n=0;
    for(const [k,v] of Object.entries(items||{}))if(v?.key===k&&/^(want|seen)$/.test(v.status)){DB.items[k]=v;n++}
    save();renderAll();toast(`${n}편의 기록을 불러왔습니다`)}catch(e){toast("불러올 수 없는 파일입니다")}};

/* ---------- boot ---------- */
fetch("data/films.json").then(r=>{if(!r.ok)throw 0;return r.json()}).then(d=>{
  FILMS=d.films.map((f,i)=>({...f,i}));BY_KEY=Object.fromEntries(FILMS.map(f=>[f.key,f]));RETIRED=d.retired||{};
  $("nomCount").textContent=`${FILMS.length}편`;
  const g=$("nomGrid");FILMS.forEach(f=>g.appendChild(card(f.key)));
  sortNominees(store.get("mymoviestar.sort","pick"));renderAll();route();
}).catch(()=>{$("nomGrid").innerHTML=`<div class="empty" style="grid-column:1/-1"><div class="big">Intermission</div><p>후보작 목록을 불러오지 못했습니다. 잠시 후 새로고침해 주세요.</p></div>`;route()});
</script>
</body>
</html>
