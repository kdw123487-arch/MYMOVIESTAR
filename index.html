<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}[hidden]{display:none!important}img{max-width:100%}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<title>My Movie Star</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..800;1,6..96,400..700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap">
<style>
/* Layout: a printed gala programme — a quiet masthead with one gold call, an index of three sections, nominee plates, and a winners roll. Gold is used sparingly: rules, numerals, the one button. */
:root{
  --velvet:#140a0d;--velvet-2:#1e0f16;--curtain:#4e0f1d;
  --gold:#d4b06a;--gold-soft:#8f7748;--ivory:#f1e8d6;--muted:#a89a8c;--faint:#6f645b;
  --line:rgba(212,176,106,.22);--line-strong:rgba(212,176,106,.5);
  --f-display:"Bodoni Moda","Didot","Times New Roman",serif;
  --f-body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-ui:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--velvet);color:var(--ivory);font-family:var(--f-body);font-size:16px;line-height:1.7;min-height:100%;
  background-image:
    radial-gradient(ellipse 50% 460px at 50% -60px, rgba(255,226,170,.14), transparent 70%);
}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:72px 96px}
button{font:inherit}
:focus-visible{outline:1px solid var(--gold);outline-offset:3px}

/* masthead */
.mast{text-align:center;display:grid;justify-items:center;gap:18px;padding-bottom:56px}
.eyebrow{font-family:var(--f-ui);font-size:11px;letter-spacing:.42em;text-transform:uppercase;color:var(--gold-soft)}
.mast h1{margin:0;font-family:var(--f-display);font-weight:400;font-size:clamp(44px,8.5vw,96px);line-height:.95;letter-spacing:-.01em}
.mast h1 em{font-style:italic;color:var(--gold)}
.rule{display:flex;align-items:center;gap:14px;color:var(--gold-soft);font-family:var(--f-body);font-size:15px;letter-spacing:.3em}
.rule::before,.rule::after{content:"";width:48px;height:1px;background:var(--line-strong)}
.btn-gold{margin-top:14px;font-family:var(--f-ui);font-size:14px;font-weight:500;letter-spacing:.14em;color:var(--velvet);background:linear-gradient(180deg,#e6cb8c,var(--gold) 60%,#b08d4c);border:0;border-radius:1px;padding:14px 30px;cursor:pointer}
.btn-gold:hover{filter:brightness(1.06)}
.txt{font-family:var(--f-ui);font-size:13px;letter-spacing:.04em;color:var(--muted);background:none;border:0;padding:4px 0;cursor:pointer;border-bottom:1px solid transparent}
.txt:hover{color:var(--ivory);border-bottom-color:var(--line-strong)}
.txt.gold{color:var(--gold)}
.txt[aria-pressed="true"]{color:var(--gold)}

/* section index */
.tabs{display:flex;justify-content:center;gap:clamp(20px,6vw,72px);border-block:1px solid var(--line);position:sticky;top:0;z-index:20;background:rgba(20,10,13,.94);backdrop-filter:blur(6px)}
.tab{background:none;border:0;color:var(--muted);cursor:pointer;padding:16px 2px 14px;display:flex;align-items:baseline;gap:8px;border-bottom:1px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab .no{font-family:var(--f-display);font-style:italic;font-size:14px;color:var(--faint)}
.tab .t{font-family:var(--f-ui);font-size:14px;letter-spacing:.06em}
.tab .c{font-family:var(--f-display);font-size:13px;color:var(--gold-soft);font-variant-numeric:tabular-nums}
.tab[aria-selected="true"]{color:var(--ivory);border-bottom-color:var(--gold)}
.tab[aria-selected="true"] .no{color:var(--gold)}

/* category index */
.filters{display:flex;flex-wrap:wrap;gap:4px 22px;justify-content:center;margin:40px 0 0}
.chip{font-family:var(--f-ui);font-size:13px;letter-spacing:.04em;color:var(--faint);background:none;border:0;border-bottom:1px solid transparent;padding:4px 0;cursor:pointer}
.chip:hover{color:var(--muted)}
.chip[aria-pressed="true"]{color:var(--ivory);border-bottom-color:var(--gold)}

/* categories */
.cat{margin-top:72px}
.cat-head{text-align:center;display:grid;gap:6px;justify-items:center;margin-bottom:36px}
.cat-no{font-family:var(--f-display);font-style:italic;font-size:15px;letter-spacing:.2em;color:var(--gold)}
.cat-head h2{margin:0;font-family:var(--f-body);font-size:26px;font-weight:700;letter-spacing:.04em}
.cat-head p{margin:0;font-family:var(--f-ui);font-size:12.5px;color:var(--faint);letter-spacing:.04em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:40px 28px}

/* nominee plate */
.card{display:flex;flex-direction:column;min-width:0}
.poster{position:relative;aspect-ratio:3/4;overflow:hidden;background:#000;outline:1px solid var(--line);outline-offset:-1px}
.poster canvas{display:block;width:100%;height:100%;transition:filter .4s ease}
.card:hover .poster canvas{filter:brightness(1.08)}
.poster .num{position:absolute;top:12px;left:14px;font-family:var(--f-display);font-size:12px;letter-spacing:.24em;color:rgba(255,255,255,.75)}
.poster .state{position:absolute;top:12px;right:14px;font-family:var(--f-ui);font-size:10px;letter-spacing:.3em;color:var(--gold)}
.poster .ptitle{position:absolute;left:14px;right:14px;bottom:14px;font-family:var(--f-display);font-style:italic;font-size:21px;line-height:1.15;color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.7);text-wrap:balance}
.card.is-seen .poster{outline-color:var(--line-strong)}

.body{padding:18px 0 0;display:flex;flex-direction:column;gap:8px;min-width:0;flex:1}
.body h3{margin:0;font-size:19px;line-height:1.35;font-weight:700;text-wrap:balance}
.sub{font-family:var(--f-ui);font-size:12px;color:var(--faint);letter-spacing:.04em}
.award{font-family:var(--f-ui);font-size:12px;color:var(--gold-soft);line-height:1.5;letter-spacing:.02em}
.plot{margin:2px 0 0;font-size:14px;color:var(--muted);line-height:1.65}
.verdict{margin:4px 0 0;display:grid;gap:4px}
.verdict .aw{font-family:var(--f-ui);font-size:11px;letter-spacing:.24em;color:var(--gold)}
.verdict q{font-size:14px;line-height:1.65;quotes:"“" "”"}
.acts{margin-top:auto;padding-top:14px;border-top:1px solid var(--line);display:flex;gap:18px;flex-wrap:wrap}
.body .acts{margin-top:auto}
.body>.acts{margin-top:auto}
.spacer{flex:1}

.stars{font-family:var(--f-ui);letter-spacing:.12em;color:var(--gold);font-size:13px;white-space:nowrap}
.stars .off{color:rgba(212,176,106,.22)}

/* empty */
.empty{margin:72px auto;max-width:420px;text-align:center;display:grid;gap:14px;justify-items:center;color:var(--muted)}
.empty .big{font-family:var(--f-display);font-style:italic;font-size:30px;color:var(--gold)}
.empty p{margin:0;font-size:15px}

/* view heads */
.view-head{text-align:center;display:grid;gap:8px;justify-items:center;margin:64px 0 48px}
.view-head h2{margin:0;font-size:28px;font-weight:700;letter-spacing:.04em}
.view-head .cat-no{display:block}
.view-head .line{font-family:var(--f-ui);font-size:12.5px;color:var(--faint);letter-spacing:.04em}
.view-tools{display:flex;gap:22px;flex-wrap:wrap;justify-content:center;align-items:center;margin-top:6px}
select.sel{font-family:var(--f-ui);font-size:13px;color:var(--muted);background:transparent;border:0;border-bottom:1px solid var(--line);padding:4px 2px;cursor:pointer}
select.sel option{background:var(--velvet-2);color:var(--ivory)}

/* winner spotlight */
.headline{display:grid;grid-template-columns:minmax(180px,260px) 1fr;gap:44px;align-items:center;padding:44px 0;border-block:1px solid var(--line-strong);margin-bottom:64px;position:relative}
.headline::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse 40% 80% at 18% 50%,rgba(212,176,106,.10),transparent 70%);pointer-events:none}
.headline .hl-body{display:grid;gap:12px;min-width:0;position:relative}
.headline .eyebrow{color:var(--gold)}
.headline h3{margin:0;font-size:clamp(30px,4.4vw,44px);line-height:1.15;font-weight:700}
.headline .en{font-family:var(--f-display);font-style:italic;color:var(--gold-soft);font-size:18px}
.headline blockquote{margin:8px 0 0;font-size:17px;line-height:1.8;white-space:pre-wrap;max-width:52ch}
.headline blockquote::before{content:"“";font-family:var(--f-display);color:var(--gold);font-size:40px;line-height:0;vertical-align:-.35em;margin-right:4px}

/* winners roll */
.roll-title{text-align:center;font-family:var(--f-ui);font-size:11px;letter-spacing:.42em;color:var(--gold-soft);margin-bottom:12px}
.roll{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.roll li{display:grid;grid-template-columns:56px 64px 1fr auto;gap:22px;align-items:center;padding:20px 0;border-bottom:1px solid var(--line)}
.roll .rk{font-family:var(--f-display);font-style:italic;font-size:30px;color:var(--gold);text-align:center;font-variant-numeric:tabular-nums}
.roll .th{width:64px;aspect-ratio:3/4;overflow:hidden;outline:1px solid var(--line);outline-offset:-1px}
.roll .th canvas{width:100%;height:100%;display:block}
.roll .info{display:grid;gap:3px;min-width:0}
.roll .info h4{margin:0;font-size:17px;font-weight:700;line-height:1.4}
.roll .info h4 span{font-family:var(--f-display);font-style:italic;font-weight:400;font-size:14px;color:var(--faint);margin-left:8px}
.roll .info .meta-line{display:flex;gap:12px;flex-wrap:wrap;align-items:baseline}
.roll .info q{font-size:14px;color:var(--muted);quotes:"“" "”";overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.roll .ra{display:flex;gap:16px}

.data-tools{margin-top:72px;display:flex;gap:6px 22px;flex-wrap:wrap;justify-content:center;font-family:var(--f-ui);font-size:12px;color:var(--faint)}
.data-tools span{flex-basis:100%;text-align:center}

.foot{margin-top:96px;padding-top:28px;border-top:1px solid var(--line);font-family:var(--f-ui);font-size:12px;color:var(--faint);text-align:center;display:grid;gap:4px}

/* modal stage */
.stage{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:rgba(8,3,5,.9);padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));overflow-y:auto}
.panel{position:relative;width:min(540px,100%);background:var(--velvet-2);border:1px solid var(--line-strong);padding:36px 32px 30px;display:grid;gap:14px}
.panel.center{text-align:center}
.panel .wposter{width:min(200px,56%);margin:6px auto;aspect-ratio:3/4;overflow:hidden;outline:1px solid var(--line);outline-offset:-1px}
.panel .wposter canvas{width:100%;height:100%;display:block}
.panel h3{margin:0;font-size:28px;line-height:1.25}
.panel .en{font-family:var(--f-display);font-style:italic;color:var(--gold-soft);font-size:17px}
.panel p{margin:0;font-size:14.5px;color:var(--muted);text-align:left;line-height:1.75}
.panel .award{text-align:center}
.pactions{display:flex;gap:22px;justify-content:center;align-items:center;flex-wrap:wrap;margin-top:8px}
.pactions .btn-gold{margin-top:0}
.reveal{animation:rise .8s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* ballot */
.form{display:grid;gap:18px;text-align:left}
.form .row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.fld{display:grid;gap:6px;min-width:0}
.fld>span,.fld legend{font-family:var(--f-ui);font-size:11px;letter-spacing:.24em;color:var(--gold-soft);padding:0}
.fld input,.fld textarea{width:100%;font-family:var(--f-ui);font-size:16px;color:var(--ivory);background:transparent;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:8px 0}
.fld textarea{font-family:var(--f-body);min-height:110px;resize:vertical;line-height:1.7;border:1px solid var(--line);padding:10px 12px}
.fld input::placeholder,.fld textarea::placeholder{color:var(--faint);opacity:.55}
.fld input:focus,.fld textarea:focus{outline:none;border-color:var(--gold)}
fieldset.fld{border:0;margin:0;padding:0}
.seg{display:flex;gap:22px}
.seg label{font-family:var(--f-ui);font-size:14px;padding:4px 0;cursor:pointer;color:var(--faint);border-bottom:1px solid transparent}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label:has(input:checked){color:var(--ivory);border-bottom-color:var(--gold)}
.seg label:has(input:focus-visible){outline:1px solid var(--gold);outline-offset:3px}
.rate{display:flex;flex-direction:row-reverse;justify-content:flex-end;gap:4px}
.rate input{position:absolute;opacity:0;pointer-events:none}
.rate label{font-size:26px;line-height:1;cursor:pointer;color:rgba(212,176,106,.2);padding:2px}
.rate label:hover,.rate label:hover~label,.rate input:checked~label{color:var(--gold)}
.rate input:focus-visible+label{outline:1px solid var(--gold);outline-offset:1px}
.rate-note{font-family:var(--f-ui);font-size:12.5px;color:var(--muted);min-height:1.4em}
.err{font-family:var(--f-ui);font-size:13px;color:#e8a59b;min-height:0}
.err:empty{display:none}

.toast{position:fixed;left:50%;bottom:max(28px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;font-family:var(--f-ui);font-size:13.5px;letter-spacing:.02em;background:var(--velvet-2);color:var(--ivory);border:1px solid var(--line-strong);padding:11px 20px;max-width:calc(100% - 32px)}


/* TMDB posters: real image fades in over the painted fallback */
.poster,.th,.wposter,.sheet-poster{position:relative}
img.pimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .6s ease;z-index:1}
.has-img img.pimg{opacity:1}
.has-img .ptitle{display:none}
.poster .num,.poster .state{z-index:2}
.poster.has-img::before{content:"";position:absolute;inset:0 0 auto;height:30%;background:linear-gradient(rgba(10,4,6,.6),transparent);z-index:2;pointer-events:none}
.sheet-poster{aspect-ratio:2/3;overflow:hidden;background:#000;outline:1px solid var(--line);outline-offset:-1px}
.sheet-poster canvas{display:block;width:100%;height:100%}
.tmdb{font-size:11px;color:var(--faint);display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:10px}
.tmdb img{display:block;opacity:.75}
.tmdb a{color:var(--muted)}

/* film detail window */
a.poster{display:block;color:inherit;text-decoration:none}
a.open{color:inherit;text-decoration:none;background-image:linear-gradient(var(--gold),var(--gold));background-size:0 1px;background-repeat:no-repeat;background-position:0 100%;transition:background-size .3s ease}
a.open:hover{background-size:100% 1px}
.roll .info h4 a.open{display:inline}
a.txt{text-decoration:none}
.sheet{position:fixed;inset:0;z-index:40;background:var(--velvet);overflow-y:auto;overscroll-behavior:contain;animation:fade .45s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet-bar{position:sticky;top:0;z-index:2;display:flex;justify-content:space-between;align-items:center;padding:14px max(20px,env(safe-area-inset-left,0px));background:linear-gradient(rgba(20,10,13,.85),rgba(20,10,13,0));transition:background-color .25s ease,border-color .25s ease;border-bottom:1px solid transparent}
.sheet.scrolled .sheet-bar{background:rgba(20,10,13,.96);border-bottom-color:var(--line)}
.sheet-bar .txt{color:var(--ivory)}
.banner{position:relative;margin-top:-58px;aspect-ratio:5/2;max-height:66vh;width:100%;overflow:hidden;background:#000}
.banner canvas{display:block;width:100%;height:100%;object-fit:cover}
.banner::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,10,13,.35) 0,transparent 30%,transparent 45%,var(--velvet) 100%)}
.banner-cap{position:absolute;left:0;right:0;bottom:0;z-index:1;max-width:1120px;margin:0 auto;padding:0 calc(300px + 64px + max(16px,env(safe-area-inset-left,0px))) 40px max(16px,env(safe-area-inset-left,0px));display:grid;gap:8px}
.banner-cap h2{margin:0;font-size:clamp(32px,5.4vw,60px);line-height:1.12;font-weight:700;letter-spacing:-.01em;text-wrap:balance;text-shadow:0 2px 24px rgba(0,0,0,.5)}
.banner-cap .en{font-family:var(--f-display);font-style:italic;font-size:clamp(18px,2.2vw,26px);color:var(--gold)}
.sheet-body{max-width:1120px;margin:0 auto;padding:40px max(16px,env(safe-area-inset-left,0px)) 96px;display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:64px}
.sec{padding-bottom:36px;margin-bottom:36px;border-bottom:1px solid var(--line)}
.sec:last-child{border-bottom:0}
.sec h3{margin:0 0 14px;font-family:var(--f-ui);font-size:11px;font-weight:500;letter-spacing:.38em;color:var(--gold-soft)}
.sec p{margin:0;font-size:16.5px;line-height:1.9;max-width:62ch;font-weight:300}
.sec .lede{font-size:17.5px}
.points{list-style:none;margin:0;padding:0;counter-reset:pt;display:grid;gap:14px}
.points li{counter-increment:pt;display:grid;grid-template-columns:36px 1fr;font-size:16px;line-height:1.7;font-weight:300}
.points li::before{content:counter(pt,upper-roman);font-family:var(--f-display);font-style:italic;color:var(--gold)}
.mybox{display:grid;gap:12px}
.mybox blockquote{margin:0;font-size:16.5px;line-height:1.85;white-space:pre-wrap;font-weight:300}
.mybox .acts{border-top:0;padding-top:4px;margin-top:0}
/* credits sheet: the first thing under the title */
.factsheet{margin:0 0 44px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid var(--line-strong);border-bottom:1px solid var(--line-strong)}
.factsheet div{padding:18px 20px 18px 0;display:grid;gap:6px;align-content:start;border-bottom:1px solid var(--line)}
.factsheet div+div{padding-left:20px;border-left:1px solid var(--line)}
.factsheet div:nth-child(3n+1){padding-left:0;border-left:0}
.factsheet div.full{grid-column:1/-1;padding-left:0;border-left:0;border-bottom:0}
.factsheet dt{font-family:var(--f-ui);font-size:11px;font-weight:500;letter-spacing:.3em;color:var(--gold-soft)}
.factsheet dd{margin:0;font-size:17px;font-weight:500;line-height:1.5;color:var(--ivory)}
.factsheet .full dd{font-weight:400}
/* side: poster lifted up beside the title */
.side{display:grid;gap:28px;align-content:start;align-self:start;margin-top:-210px;position:relative;z-index:2}
.sheet-body>.side{grid-column:2;grid-row:1}
.sheet-body>main{grid-column:1;grid-row:1;min-width:0}
.side .sheet-poster{box-shadow:0 24px 60px rgba(0,0,0,.55)}
.honors{display:grid;gap:8px;padding-bottom:20px;border-bottom:1px solid var(--line)}
.honors dt{font-family:var(--f-ui);font-size:11px;font-weight:500;letter-spacing:.3em;color:var(--gold-soft)}
.honors dd{margin:0;font-size:15px;line-height:1.6}
.honors .nf{font-size:13px;color:var(--muted)}
@media (max-width:820px){
  .banner{aspect-ratio:4/3;max-height:none}
  .banner::after{background:linear-gradient(180deg,rgba(20,10,13,.4) 0,rgba(20,10,13,.2) 22%,rgba(20,10,13,.75) 58%,var(--velvet) 100%)}
  .banner-cap{padding:0 calc(36% + 24px) 28px max(16px,env(safe-area-inset-left,0px))}
  .sheet-body{grid-template-columns:1fr;gap:0;padding-top:20px}
  .sheet-body>.side,.sheet-body>main{grid-column:auto;grid-row:auto}
  .side{order:-1;margin-top:-170px;gap:20px;margin-bottom:28px}
  .side .sheet-poster{width:36%;justify-self:end}
  .factsheet{grid-template-columns:1fr 1fr}
  .factsheet div,.factsheet div+div{padding:14px 12px 14px 0;border-left:0}
  .factsheet div:nth-child(2n){padding-left:14px;border-left:1px solid var(--line)}
  .factsheet div.full{padding-left:0;border-left:0}
  .factsheet dd{font-size:15.5px}
  .sec p{font-size:16px}
}
@keyframes fadeOut{from{opacity:1;transform:none}to{opacity:0;transform:scale(.985)}}
.sheet.leaving{animation:fadeOut .38s ease forwards;pointer-events:none}
@media (prefers-reduced-motion:reduce){.sheet,.sheet.leaving{animation:none}.reveal{animation:none}.poster canvas{transition:none}}
@media (max-width:640px){
  body{background-image:radial-gradient(ellipse 90% 380px at 50% -60px, rgba(255,226,170,.14), transparent 70%)}
  .wrap{padding-block:48px 64px}
  .tabs{gap:18px}.tab .no{display:none}.tab .t{font-size:13.5px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:32px 16px}

}

  if(y)u.searchParams.set("year",y);
  const bearer=TMDB_KEY.length>40,headers={accept:"application/json"};
  if(bearer)headers.Authorization="Bearer "+TMDB_KEY;else u.searchParams.set("api_key",TMDB_KEY);
  const r=await fetch(u,{headers});if(!r.ok)throw new Error("tmdb "+r.status);
  const j=await r.json();const hit=(j.results||[]).find(m=>m.poster_path);return hit?{p:hit.poster_path,id:hit.id}:null;
}
function posterFor(key){
  const sig=tmdbSig(key),sg=sig.q+"|"+sig.y,c=TC[key];
  if(!sig.q)return Promise.resolve(null);
  if(c&&c.s===sg&&(c.p||Date.now()-c.t<7*864e5))return Promise.resolve(c.p||null);
  if(!TMDB_KEY)return Promise.resolve(null);
  if(tPending[key])return tPending[key];
  return tPending[key]=new Promise(res=>{tQueue.push(async()=>{
    try{let hit=await tSearch(sig.q,sig.y);if(!hit&&sig.y)hit=await tSearch(sig.q,"");
      TC[key]={s:sg,p:hit?hit.p:null,id:hit?hit.id:null,t:Date.now()};tcSave();res(hit?hit.p:null)}
    catch(err){res(null)}finally{delete tPending[key]}});tPump()});
}
function attachPoster(box,key,size){
  if(!box)return;
  posterFor(key).then(p=>{
    if(!p||!box.isConnected)return;
    let img=box.querySelector("img.pimg");if(img&&img.dataset.p===p)return;
    if(!img){img=document.createElement("img");img.className="pimg";img.alt="";img.decoding="async";img.loading="lazy";box.appendChild(img)}
    img.dataset.p=p;img.onload=()=>box.classList.add("has-img");img.onerror=()=>{img.remove();box.classList.remove("has-img")};
    img.src=TMDB_IMG+(size||"w342")+p;
  });
}

          <div class="rate">${[5,4,3,2,1].map(n=>`<input type="radio" name="rating" id="r${n}" value="${n}" ${rating===n?"checked":""}><label for="r${n}" aria-label="${n}점 ${RATE_NOTE[n]}">★</label>`).join("")}</div>
          <div class="rate-note" id="rateNote">${rating?RATE_NOTE[rating]:"별점으로 시상 등급을 정합니다"}</div></fieldset>
        <label class="fld"><span>관람일</span><input type="date" name="date" value="${esc(e&&e.date||today())}" max="${today()}"></label>
      </div>
      <label class="fld"><span id="revLabel">${status==="seen"?"심사평":"메모"}</span><textarea name="review" maxlength="2000">${esc(e&&e.review||"")}</textarea></label>
      <div class="err" id="ferr" role="alert"></div>
      <div class="pactions"><button class="btn-gold" type="submit">${submitTxt(status)}</button>
        ${isNew?"":`<button class="txt" type="button" data-remove="${key}" data-in-form>삭제</button>`}
        <button class="txt" type="button" data-close>취소</button></div>
    </form>`);
  const form=document.getElementById("rf"),seenBox=form.querySelector(".seen-only");
  const sync=()=>{const s=form.status.value;seenBox.hidden=s!=="seen";
    document.getElementById("revLabel").textContent=s==="seen"?"심사평":"메모";
    form.querySelector('[type="submit"]').textContent=submitTxt(s);document.getElementById("fEye").textContent=eyebrow(s)};
  form.querySelectorAll('[name="status"]').forEach(r=>r.onchange=sync);
  form.querySelectorAll('[name="rating"]').forEach(r=>r.onchange=()=>{document.getElementById("rateNote").textContent=RATE_NOTE[r.value]});
  form.onsubmit=ev=>{
    ev.preventDefault();const fd=new FormData(form),err=document.getElementById("ferr");
    const st=fd.get("status"),rt=Number(fd.get("rating")||0);
    const ko=fixed?f.ko:String(fd.get("ko")||"").trim();
    if(!ko){err.textContent="제목을 입력해 주세요.";form.ko.focus();return}
    if(st==="seen"&&!rt){err.textContent="별점을 골라 주세요.";form.querySelector('[name="rating"]').focus();return}
    const k=key||("u:"+Date.now().toString(36)+Math.random().toString(36).slice(2,6));
    const prev=entry(k)||{added:Date.now()};
    const rec={...prev,key:k,status:st,review:String(fd.get("review")||"").trim(),updated:Date.now()};
    if(!fixed){rec.ko=ko;rec.en=String(fd.get("en")||"").trim();
      const yn=String(fd.get("yn")||"").trim(),m=yn.match(/^(\d{4})?\s*[·,\/-]?\s*(.*)$/);
      rec.y=m&&m[1]||"";rec.n=(m?m[2]:yn).trim()}
    if(st==="seen"){rec.rating=rt;rec.date=fd.get("date")||today()}else{delete rec.rating;delete rec.date}
    DB.items[k]=rec;save();closePanel();renderAll();
    toast(st==="seen"?`〈${ko}〉 ${AWARDS[rt]} 수상`:`〈${ko}〉 관람 예정에 담았습니다`);
  };
  (fixed?form.querySelector('[name="status"]:checked'):form.ko).focus();
}

function toggleWant(key){
  const e=entry(key),f=BY_KEY[key],name=f?f.ko:e&&e.ko;
  if(e&&e.status==="want"){delete DB.items[key];toast(`〈${name}〉 관람 예정에서 뺐습니다`)}
  else{DB.items[key]={...(e||{}),key,status:"want",added:Date.now(),updated:Date.now()};toast(`〈${name}〉 관람 예정에 담았습니다`)}
  save();renderAll();
}
function removeEntry(key){
  const e=entry(key);if(!e)return;const name=displayOf(e).ko;
  if(e.status==="seen"&&!confirm(`〈${name}〉의 심사 기록을 삭제할까요?`))return;
  delete DB.items[key];save();renderAll();toast(`〈${name}〉 기록을 삭제했습니다`);
}

document.addEventListener("click",ev=>{
  const b=ev.target.closest("button");if(!b)return;const d=b.dataset;
  if("close" in d){closePanel();return}
  if(d.toggleWant){toggleWant(d.toggleWant);if("fromEnv" in d)closePanel();return}
  if(d.review){reviewForm(d.review,"seen");return}
  if(d.edit){reviewForm(d.edit);return}
  if(d.remove){if("inForm" in d)closePanel();removeEntry(d.remove);return}
  if(d.goto){show(d.goto,true);return}
  if("leave" in d){leaveSheet();return}
});
document.getElementById("openEnv").onclick=envelope;
document.addEventListener("click",ev=>{const a=ev.target.closest("[data-close-link]");if(a)closePanel()});

/* backup */
document.getElementById("exportBtn").onclick=()=>{
  const blob=new Blob([JSON.stringify({app:"mymoviestar",v:1,exported:new Date().toISOString(),items:DB.items},null,2)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`mymoviestar-${today()}.json`;
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
};
const fileIn=document.getElementById("importFile");
document.getElementById("importBtn").onclick=()=>fileIn.click();
fileIn.onchange=async()=>{
  const file=fileIn.files[0];fileIn.value="";if(!file)return;
  try{const d=JSON.parse(await file.text());const items=d&&d.items;if(!items||typeof items!=="object")throw 0;
    let n=0;for(const [k,v] of Object.entries(items)){if(v&&v.key===k&&(v.status==="want"||v.status==="seen")){DB.items[k]=v;n++}}
    save();renderAll();toast(`${n}편의 기록을 불러왔습니다`);
  }catch(e){toast("불러올 수 없는 파일입니다")}
};

renderAll();
route();
</script>
</body>
</html>
